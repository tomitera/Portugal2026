e com oito bicas, representando as antigas ruas que convergiam para a praça, e os longos pórticos que abrigam cafés e pequenas lojas.</p><p>Sente-se por alguns minutos em uma das esplanadas. Em Évora, observar a cidade faz parte do passeio.</p><h4>Rua 5 de Outubro</h4><p>Esta é uma das ruas mais agradáveis para caminhar no centro histórico.</p><p>Ao longo do percurso encontram-se pequenas lojas familiares, oficinas de artesanato, livrarias, galerias e estabelecimentos que vendem produtos típicos do Alentejo, como cortiça, cerâmica pintada à mão, azeites, vinhos e doces regionais.</p><p>Olhe também para as fachadas. Muitas preservam elementos arquitetônicos de séculos diferentes, revelando como a cidade cresceu sem perder sua identidade.</p><p>Mais do que uma rua comercial, ela permite sentir a vida cotidiana de Évora.</p><h4>Almoço Alentejano</h4><p>Antes de seguir viagem, aproveite para experimentar a gastronomia da região.</p><p>A cozinha alentejana valoriza ingredientes simples transformados em pratos cheios de personalidade. O pão, o azeite, o alho, os coentros e as ervas aromáticas aparecem em diversas receitas tradicionais.</p><p>Entre as especialidades estão as migas, a sopa de cação, o ensopado de borrego e os pratos preparados com porco preto.</p><p>Se desejar acompanhar a refeição com vinho, o Alentejo produz alguns dos rótulos mais reconhecidos de Portugal.</p><p>É um excelente encerramento para a experiência na cidade.</p><h4>Viagem para Lagos</h4><p>Depois do almoço, começa uma das maiores etapas de deslocamento da viagem.</p><p>A estrada atravessa grande parte do Alentejo antes de alcançar o Algarve. Durante o percurso, observe como a paisagem muda lentamente. Os extensos campos agrícolas, os sobreiros, as oliveiras e as planícies dão lugar, pouco a pouco, à vegetação mais mediterrânea e ao relevo característico do sul de Portugal.</p><p>É uma viagem tranquila, feita por excelentes autoestradas, que marca a transição entre duas regiões completamente diferentes do país.</p><h4>Chegada a Lagos</h4><p>Ao chegar ao Algarve, a mudança de atmosfera é imediata.</p><p>A luz parece mais intensa, o clima torna-se mais quente e o oceano volta a fazer parte da paisagem.</p><p>Faça o check-in com tranquilidade e aproveite para caminhar pelas ruas próximas ao alojamento.</p><p>Mesmo sem um roteiro definido para esta noite, já será possível perceber por que Lagos é considerada uma das cidades mais agradáveis do litoral português.</p><h4>Jantar em Lagos</h4><p>Depois de um longo dia de viagem, nada melhor do que encerrar a noite à mesa.</p><p>Lagos oferece uma excelente combinação entre restaurantes tradicionais, marisqueiras e cozinhas contemporâneas.</p><p>Aproveite para experimentar peixes frescos, polvo grelhado, arroz de marisco ou simplesmente escolher um restaurante com vista para a marina ou para o centro histórico.</p><p>Este jantar marca simbolicamente o início da etapa algarvia da viagem.</p><p>A partir de amanhã, o protagonista deixa de ser o patrimônio histórico e passa a ser a costa portuguesa, com suas falésias, praias e algumas das paisagens mais espetaculares da Europa.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Praça do Giraldo.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Dom Joaquim • Fialho • Botequim da Mouraria.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> parada durante a viagem, se necessário.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Lagos – Casinha do Petisco • Adega da Marina • Don Sebastião.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Évora+Portugal"}, "12": {"label": "D12", "title": "Lagos", "region": "Algarve", "map": "mapa_d12.png", "opening": "<p class=\"day-subtitle\">Praias, paisagens e descanso</p><p>Depois de dias percorrendo castelos, mosteiros, centros históricos e cidades medievais, chega o momento de conhecer uma face completamente diferente de Portugal.</p><p>Lagos reúne algumas das paisagens costeiras mais impressionantes do país. Ao longo de milhões de anos, o vento, a chuva e principalmente o mar esculpiram as falésias douradas que hoje formam arcos naturais, grutas, enseadas escondidas e praias de águas incrivelmente transparentes.</p><p>Mais do que um roteiro de atrações, este é um dia para desacelerar. Caminhar junto ao oceano, sentir a brisa do Atlântico, mergulhar nas águas do Algarve e simplesmente contemplar a paisagem fazem parte da experiência.</p><p>Embora seja hoje um dos principais destinos turísticos portugueses, Lagos também possui uma rica história ligada às Grandes Navegações. Foi daqui que partiram diversas expedições portuguesas durante o século XV, transformando a cidade em um importante porto da Era dos Descobrimentos.</p><p>Hoje, porém, quem conduz o passeio é a própria natureza.</p>", "route": "<h4>Café no Centro Histórico</h4><p>Antes de seguir para as praias, vale a pena começar o dia no centro histórico de Lagos.</p><p>As ruas de pedra, as casas caiadas de branco e as fachenas com detalhes coloridos preservam muito do charme da antiga cidade portuguesa. Apesar do crescimento do turismo, Lagos conseguiu manter um ambiente agradável, com pequenas praças, cafés, confeitarias e lojas independentes.</p><p>Aproveite para tomar um café acompanhado de um pastel de nata ou de outra especialidade da pastelaria portuguesa. Caminhe sem pressa pelas ruas estreitas e observe como o centro histórico mistura edifícios antigos com uma atmosfera leve e descontraída.</p><p>É uma excelente maneira de entrar no ritmo do Algarve.</p><h4>Ponta da Piedade</h4><p>Poucos lugares representam tão bem a beleza natural do Algarve quanto a Ponta da Piedade.</p><p>As falésias douradas, esculpidas pela erosão ao longo de milhões de anos, formam um verdadeiro labirinto de arcos, pilares de pedra, pequenas grutas e enseadas de águas azul-turquesa.</p><p>Do alto do miradouro, a vista já é espetacular. Caminhe pelos passadiços de madeira e observe como cada curva revela uma nova composição de rochas e mar.</p><p>Se decidir descer a longa escadaria até o nível da água, a perspectiva muda completamente. Lá embaixo é possível perceber as dimensões das formações rochosas e admirar a transparência da água.</p><p>Muitos passeios de barco e de caiaque partem deste local para explorar as grutas vistas do mar. Mesmo para quem permanece apenas nos miradouros, a Ponta da Piedade costuma ser considerada um dos pontos altos de toda a viagem ao Algarve.</p><p>Reserve tempo para simplesmente contemplar a paisagem. Poucas fotografias conseguem transmitir a sensação de estar diante dessas falésias.</p><h4>Praia do Camilo</h4><p>A Praia do Camilo é pequena, mas frequentemente aparece entre as praias mais bonitas de Portugal.</p><p>O acesso é feito por uma longa escadaria de madeira que desce pela falésia. Durante a descida, aproveite para observar os diferentes tons das rochas calcárias e a vista panorâmica sobre o oceano.</p><p>Ao chegar à areia, chama a atenção o contraste entre o dourado das falésias, o branco da areia e o azul intenso do mar.</p><p>Na maré baixa, um pequeno túnel escavado na própria rocha liga duas enseadas, permitindo descobrir diferentes perspectivas da praia.</p><p>Mesmo que não pretenda permanecer muito tempo, vale a pena fazer a descida apenas pela beleza do lugar.</p><h4>Praia Dona Ana</h4><p>Se a Praia do Camilo impressiona pela paisagem, a Praia Dona Ana convida a permanecer.</p><p>Considerada durante muitos anos uma das praias mais bonitas da Europa, ela reúne tudo aquilo que tornou o Algarve famoso: águas cristalinas, falésias douradas, areia clara e mar geralmente calmo durante o verão.</p><p>Escolha um local na areia, aproveite para nadar ou simplesmente relaxe observando a paisagem.</p><p>As formações rochosas próximas à costa criam diferentes tons de azul ao longo do dia, especialmente quando o sol está mais alto.</p><p>Lembre-se apenas de respeitar as bandeiras de segurança e as orientações dos salva-vidas. Embora normalmente tranquilo, o Atlântico pode apresentar correntes em determinados períodos.</p><p>Este é provavelmente o momento mais relaxante de toda a viagem.</p><h4>Jantar no Centro Histórico</h4><p>Quando anoitece, o centro histórico de Lagos ganha uma atmosfera completamente diferente.</p><p>As ruas ficam movimentadas, os restaurantes espalham mesas pelas calçadas e músicos de rua ajudam a criar um ambiente agradável e descontraído.</p><p>É uma ótima oportunidade para experimentar peixes frescos, polvo grelhado, arroz de marisco ou outros pratos típicos da gastronomia algarvia.</p><p>Depois do jantar, caminhe mais alguns minutos pelas ruas iluminadas. O clima costuma ser animado, mas sem perder o charme de uma cidade histórica voltada para o mar.</p><p>Este é um daqueles dias em que o roteiro termina naturalmente, sem pressa para voltar.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> pastelaria no Centro Histórico.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> O Camilo • Luca&#x27;s Rooftop.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> café ou gelato no Centro Histórico.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Casinha do Petisco • Don Sebastião • The Green Room.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Lagos+Portugal"}, "13": {"label": "D13", "title": "As Falésias do Algarve", "region": "Algarve", "map": "mapa_d13.png", "opening": "", "route": "<h4>Grutas, mirantes e um fim de tarde à beira-mar</h4><p>Durante milhões de anos, o oceano Atlântico trabalhou pacientemente sobre as rochas calcárias do litoral algarvio. O resultado é uma das paisagens costeiras mais impressionantes da Europa: falésias douradas, arcos naturais, grutas esculpidas pela água e pequenas praias escondidas entre paredões de pedra.</p><p>Hoje você conhecerá justamente esse trecho do Algarve. O passeio combina mar, geologia, navegação e alguns dos mirantes mais famosos de Portugal.</p><p>A melhor forma de compreender essa costa é observá-la sob diferentes perspectivas. Primeiro pelo mar, navegando entre grutas e arcos naturais. Depois do alto das falésias, onde a dimensão da paisagem se revela por completo.</p><p>Mais do que um dia de praia, este é um dia para contemplar a força da natureza e entender como ela moldou um dos cartões-postais mais conhecidos de Portugal.</p><h4>Passeio de barco em Carvoeiro</h4><p>O passeio começa no pequeno cais de Carvoeiro, antiga vila de pescadores que hoje se tornou um dos destinos mais procurados do Algarve.</p><p>Ao deixar a costa, a paisagem muda rapidamente. As falésias revelam formas impossíveis de perceber a partir da terra, enquanto pequenas praias escondidas aparecem entre paredões de pedra dourada.</p><p>Durante a navegação, observe como a água muda constantemente de cor. Dependendo da profundidade e da incidência do sol, o mar alterna entre tons de azul-escuro, verde-esmeralda e turquesa.</p><p>Entre os principais destaques estão a Gruta de Benagil, a Praia do Carvalho, os Arcos da Marinha e diversas cavernas esculpidas pela ação do mar.</p><p>Sempre que possível, sente-se próximo à borda da embarcação. A visão das falésias a partir do nível do mar é completamente diferente daquela obtida nos mirantes.</p><h4>Gruta de Benagil</h4><p>Poucos lugares simbolizam tanto o Algarve quanto a Gruta de Benagil.</p><p>Formada naturalmente pela erosão do calcário, ela possui uma enorme abertura circular no teto, conhecida como &quot;olho da gruta&quot;, por onde a luz do sol penetra e ilumina a pequena praia existente em seu interior.</p><p>Essa claraboia natural cria um espetáculo de luzes que muda ao longo do dia, tornando cada visita única.</p><p>A gruta só pode ser acessada pelo mar. Atualmente, o desembarque na praia é restrito na maior parte dos passeios, mas a entrada da embarcação já permite admirar toda a imponência do local.</p><p>Observe como as camadas de rocha revelam milhões de anos de transformações geológicas provocadas pelo oceano.</p><h4>Praia do Carvalho</h4><p>Vista do mar, a Praia do Carvalho parece escondida entre gigantescas paredes de pedra.</p><p>Seu acesso terrestre também é uma atração. Um túnel escavado manualmente na falésia conduz até a pequena enseada, preservando durante muito tempo o aspecto quase secreto da praia.</p><p>Durante o passeio de barco, repare na coloração das rochas e na transparência da água, que costuma impressionar mesmo quem já conhece outras praias do Algarve.</p><p>É um dos lugares onde a força da natureza e a escala das falésias podem ser percebidas com maior intensidade.</p><h4>Arcos da Marinha</h4><p>As formações conhecidas como Arcos da Marinha representam um dos cenários naturais mais fotografados de Portugal.</p><p>Os arcos surgiram ao longo de milhares de anos, quando a erosão abriu sucessivas cavernas na base das falésias até formar grandes passagens naturais.</p><p>Observe como algumas dessas formações lembram pontes de pedra suspensas sobre o mar.</p><p>Dependendo da posição do barco e da luz do dia, as sombras criadas pelas rochas produzem um contraste impressionante com o azul da água.</p><p>É um excelente momento para deixar a câmera de lado por alguns instantes e simplesmente apreciar a paisagem.</p><h4>Almoço em Carvoeiro</h4><p>Após o passeio de barco, aproveite para conhecer melhor o centro de Carvoeiro.</p><p>Apesar do crescimento do turismo, a vila preserva um ambiente agradável, com ruas estreitas, casas brancas e diversos restaurantes voltados para o mar.</p><p>Escolha uma mesa com vista para a praia e experimente peixes frescos, polvo, lulas ou outro prato típico da culinária algarvia.</p><p>Depois do almoço, caminhe alguns minutos pelo calçadão e observe o movimento das embarcações retornando ao porto.</p><h4>Mirante da Praia da Marinha</h4><p>Se a vista do barco impressiona, o mirante da Praia da Marinha oferece uma perspectiva completamente diferente.</p><p>Do alto das falésias é possível compreender a dimensão de toda a paisagem. Os arcos naturais, os pilares de pedra e o mar cristalino formam um cenário frequentemente incluído entre as praias mais bonitas da Europa.</p><p>Caminhe com calma pelos passadiços e procure diferentes ângulos para observar a costa.</p><p>A luz do início da tarde costuma destacar os tons dourados das falésias, criando um contraste marcante com o azul intenso do Atlântico.</p><p>É um dos locais mais fotogênicos de toda a viagem.</p><h4>Mirante da Praia do Carvalho (opcional)</h4><p>Caso ainda tenha disposição, faça uma breve parada no mirante da Praia do Carvalho.</p><p>Diferentemente da Praia da Marinha, aqui a paisagem transmite uma sensação maior de isolamento. As falésias cercam completamente a enseada, criando um ambiente quase escondido.</p><p>Vale a pena observar a entrada do famoso túnel escavado na rocha, que durante décadas foi o único acesso terrestre à praia.</p><p>Mesmo uma visita rápida costuma render belas fotografias.</p><h4>Praia do Porto de Mós</h4><p>O fim da tarde reserva um clima completamente diferente.</p><p>Depois de um dia de deslocamentos e contemplação, a Praia do Porto de Mós convida simplesmente a permanecer.</p><p>Sua extensa faixa de areia permite caminhar junto ao mar, relaxar ao sol ou tomar um último banho nas águas do Atlântico.</p><p>As altas falésias que cercam a praia continuam presentes, mas agora a paisagem transmite tranquilidade em vez de imponência.</p><p>Se o horário permitir, permaneça até próximo ao pôr do sol. A luz dourada refletida sobre as rochas transforma completamente o cenário.</p><p>É um excelente encerramento para um dos dias mais belos da viagem.</p><h4>Jantar em Lagos</h4><p>De volta a Lagos, aproveite a noite para revisitar o centro histórico.</p><p>Depois de um dia dedicado às paisagens naturais, o jantar oferece uma oportunidade para voltar ao ambiente acolhedor da cidade.</p><p>Escolha um restaurante tranquilo, caminhe pelas ruas iluminadas e aproveite o ritmo descontraído do Algarve.</p><p>É curioso perceber como o dia termina de maneira muito diferente de como começou: pela manhã, o mar era visto de dentro das grutas; agora ele serve apenas como pano de fundo para uma noite agradável em uma das cidades mais charmosas do sul de Portugal.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Lagos: Black and White Coffee Shop • Coffee &amp; Waves • pastelaria próxima ao Airbnb.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Carvoeiro: Boneca Bar • A Fonte • O Stop (todos próximos ao cais e ao centro).</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Praia de Porto de Mós: bar de praia para um drink, café ou petisco após o banho de mar.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Centro Histórico de Lagos: Casinha do Petisco • Don Sebastião • Adega da Marina.</p><p class=\"food-line\"><strong>Dica:</strong> as sugestões acompanham o percurso do dia para evitar deslocamentos desnecessários.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=As+Falésias+do+Algarve+Portugal"}, "14": {"label": "D14", "title": "Manhã em Lagos e Noite em Castro Marim", "region": "Algarve", "map": "mapa_d14.png", "opening": "<p class=\"day-subtitle\">Um dia entre o Atlântico e a Idade Média</p><p>A viagem entra em sua reta final, mas ainda reserva algumas surpresas.</p><p>A manhã é dedicada a aproveitar Lagos sem horários rígidos. Depois de conhecer as falésias e as praias mais famosas, hoje é um convite para viver a cidade com tranquilidade: uma última praia, uma caminhada pelo centro histórico, um bom almoço e algumas horas de descanso antes de seguir viagem.</p><p>No fim da tarde, o cenário muda completamente.</p><p>A cerca de uma hora de carro, Castro Marim revive sua história durante os Dias Medievais, um dos eventos culturais mais tradicionais do Algarve. Ruas iluminadas por tochas, músicos, cavaleiros, artesãos, mercados e apresentações transformam a vila em um grande cenário medieval.</p><p>Será um dia marcado por dois ritmos muito diferentes: a serenidade do litoral durante a manhã e a animação de uma cidade medieval ao cair da noite.</p>", "route": "<h4>Praia da Luz</h4><p>A Praia da Luz é uma excelente escolha para começar o dia.</p><p>Mais tranquila que muitas das praias centrais de Lagos, ela combina uma ampla faixa de areia dourada com águas geralmente calmas durante o verão. A praia é protegida por uma grande baía e oferece ótima infraestrutura, com restaurantes, cafés e aluguel de espreguiçadeiras.</p><p>Observe, na extremidade leste, a impressionante falésia escura conhecida como Rocha Negra. Formada por antigas rochas vulcânicas, ela contrasta com o calcário claro predominante em boa parte do Algarve e revela um capítulo diferente da história geológica da região.</p><p>Se decidir caminhar pelo calçadão, aproveite a vista sobre toda a enseada. Nas primeiras horas da manhã, a praia costuma estar especialmente tranquila, ideal para um banho de mar ou simplesmente para contemplar o Atlântico antes de seguir viagem.</p><h4>Centro Histórico de Lagos</h4><p>Antes de deixar Lagos, reserve algum tempo para caminhar novamente pelo seu centro histórico.</p><p>Agora, sem a pressa dos primeiros dias, é possível observar detalhes que muitas vezes passam despercebidos: as pequenas praças, as fachadas caiadas de branco, as varandas floridas e as ruas de pedra que preservam o traçado da antiga cidade.</p><p>Vale a pena visitar a Igreja de Santo António, considerada uma das mais belas igrejas barrocas de Portugal, com seu interior ricamente decorado em talha dourada e painéis de azulejos.</p><p>Passe também pela Praça Gil Eanes e pela Marina de Lagos, onde embarcações modernas dividem espaço com um porto que, há séculos, participou das grandes expedições marítimas portuguesas.</p><p>É um bom momento para comprar alguma lembrança ou simplesmente aproveitar a atmosfera descontraída da cidade.</p><h4>Almoço em Lagos</h4><p>Escolha o almoço sem pressa.</p><p>Os restaurantes do centro histórico oferecem desde a tradicional cozinha portuguesa até opções contemporâneas inspiradas nos sabores do mar.</p><p>Peixes grelhados, polvo, arroz de marisco, cataplana algarvia e sardinhas assadas estão entre as especialidades da região.</p><p>Se possível, escolha uma mesa ao ar livre. Aproveite para observar o movimento da cidade e encerrar sua passagem por Lagos da forma mais agradável possível.</p><h4>Retorno ao Airbnb</h4><p>Antes da próxima etapa da viagem, vale a pena fazer uma pausa.</p><p>Retorne ao alojamento para tomar banho, organizar as malas e descansar um pouco. Essa pausa fará diferença, já que a programação da noite costuma estender-se por várias horas.</p><p>É também um bom momento para revisar fotografias, carregar baterias da câmera e preparar-se para uma experiência completamente diferente daquela vivida no litoral.</p><h4>Viagem para Castro Marim</h4><p>A viagem até Castro Marim dura cerca de uma hora e atravessa praticamente todo o Algarve oriental.</p><p>Durante o percurso, observe como a paisagem muda gradualmente. As grandes falésias dão lugar a áreas mais abertas, salinas, pequenas colinas e campos agrícolas.</p><p>Próximo ao destino, surge o vale do rio Guadiana, que marca a fronteira natural entre Portugal e Espanha.</p><p>Ao longe, o castelo domina a paisagem e anuncia a chegada a uma das vilas históricas mais bem preservadas da região.</p><h4>Dias Medievais de Castro Marim</h4><p>Durante alguns dias do verão, Castro Marim abandona o século XXI.</p><p>As ruas do centro histórico são tomadas por mercadores, artesãos, músicos, cavaleiros, falcoeiros, atores e centenas de figurantes vestidos com trajes medievais.</p><p>Criado em 1996, o evento tornou-se um dos maiores festivais medievais de Portugal e atrai visitantes de todo o país.</p><p>Enquanto caminha pela vila, deixe-se envolver pelo ambiente. Sons de tambores, cheiro de especiarias, demonstrações de artesanato e pequenas encenações acontecem praticamente em cada esquina.</p><p>Não tenha pressa. Parte da experiência consiste justamente em explorar sem um roteiro rígido.</p><h4>Castelo de Castro Marim</h4><p>Dominando a vila desde o século XIII, o Castelo de Castro Marim ocupa uma posição estratégica sobre o rio Guadiana.</p><p>Durante séculos, controlou uma importante rota comercial e desempenhou papel fundamental na defesa da fronteira portuguesa.</p><p>Foi também uma das primeiras sedes da Ordem de Cristo, instituição que mais tarde financiaria parte das Grandes Navegações portuguesas.</p><p>Suba às muralhas e aproveite a vista panorâmica. De um lado está a vila medieval; do outro, o rio Guadiana e as terras espanholas.</p><p>Durante o festival, o castelo torna-se um dos principais palcos das apresentações, criando uma atmosfera especialmente envolvente.</p><h4>Mercado Medieval</h4><p>O mercado é o coração dos Dias Medievais.</p><p>Entre barracas de madeira decoradas com bandeiras coloridas, encontram-se artesãos trabalhando couro, ferro, madeira, cerâmica, tecidos e joias inspiradas na Idade Média.</p><p>Também é uma ótima oportunidade para conhecer produtos típicos da região, provar doces tradicionais, comprar lembranças e observar demonstrações de antigos ofícios.</p><p>Mesmo quem não pretende fazer compras costuma passar bastante tempo explorando cada rua e cada praça.</p><h4>Gastronomia e Espetáculos</h4><p>À medida que anoitece, o festival ganha ainda mais vida.</p><p>As áreas de alimentação oferecem pratos tradicionais portugueses, carnes assadas, petiscos, doces conventuais e bebidas inspiradas na época medieval, incluindo hidromel.</p><p>Ao longo da noite acontecem apresentações musicais, danças, cortejos, espetáculos de fogo, teatro de rua e demonstrações de combate medieval.</p><p>As muralhas iluminadas criam um cenário inesquecível, tornando fácil imaginar como seria a vida em uma fortaleza portuguesa há muitos séculos.</p><p>É um encerramento perfeito para um dia que começou diante do Atlântico e termina mergulhado na atmosfera da Idade Média.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Praia da Luz: Paraiso Restaurante • Fortaleza da Luz • cafés à beira-mar.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Centro Histórico de Lagos: Avenida Restaurante • The Green Room • Mar d&#x27;Estórias.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> No Airbnb antes da saída ou durante a viagem para Castro Marim.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Dias Medievais de Castro Marim: petiscos, hidromel, carnes grelhadas e gastronomia típica nas barracas do evento.</p><p class=\"food-line\"><strong>Dica:</strong> as sugestões acompanham o percurso do dia para evitar deslocamentos desnecessários.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Manhã+em+Lagos+e+Noite+em+Castro+Marim+Portugal"}, "15": {"label": "D15", "title": "Do Sol do Algarve às Margens do Douro", "region": "Algarve → Porto", "map": "mapa_d15.png", "opening": "<p class=\"day-subtitle\">Um dia de transição, parte da experiência</p><p>Hoje a viagem muda completamente de cenário.</p><p>Pela manhã, você deixa as praias do Algarve para iniciar o deslocamento rumo ao norte de Portugal. Em vez de enfrentar quase seis horas de carro até o Porto, o roteiro aproveita uma combinação bastante confortável: dirigir apenas até Lisboa, devolver o veículo e seguir de Alfa Pendular, um dos trens mais rápidos e confortáveis do país.</p><p>Essa estratégia reduz o desgaste da viagem, evita o trânsito da entrada no Porto e ainda permite um agradável almoço no Parque das Nações, uma das áreas mais modernas de Lisboa.</p><p>Ao chegar ao Porto, a atmosfera muda novamente. Depois de dias entre praias, falésias e pequenas cidades históricas, você encontrará uma cidade construída sobre encostas, voltada para o rio Douro e marcada por pontes, igrejas e séculos de tradição comercial.</p><p>É um dia de deslocamento, mas também de preparação para a última grande etapa da viagem.</p>", "route": "<h4>Saída de Lagos</h4><p>A manhã começa sem pressa.</p><p>Após o café da manhã, organize as malas, confira se nada ficou no alojamento e faça o check-out com tranquilidade. Como a maior parte do percurso será feita por autoestrada, vale a pena sair no horário previsto para evitar qualquer preocupação com os horários do trem.</p><p>A viagem até Lisboa percorre praticamente toda a costa sul portuguesa antes de seguir em direção ao vale do Tejo. É um bom momento para recordar os dias passados no Algarve e observar como a paisagem vai mudando gradualmente ao longo do caminho.</p><h4>Parque das Nações</h4><p>Antes de seguir para o Porto, vale a pena fazer uma última parada em Lisboa.</p><p>Construído para a Expo 98, o Parque das Nações representa uma Lisboa completamente diferente daquela visitada nos primeiros dias da viagem. Aqui predominam arquitetura contemporânea, amplos espaços públicos, jardins, ciclovias e uma agradável promenade às margens do rio Tejo.</p><p>Escolha um restaurante com vista para o rio e aproveite o almoço sem pressa. É uma pausa estratégica que torna o restante do deslocamento muito mais confortável.</p><p>Se houver tempo, caminhe alguns minutos pelo calçadão antes de seguir para a estação.</p><h4>Estação do Oriente</h4><p>Projetada pelo arquiteto espanhol Santiago Calatrava, a Gare do Oriente é uma das estações ferroviárias mais bonitas da Europa.</p><p>Sua cobertura metálica lembra uma floresta de árvores estilizadas e cria um ambiente amplo e iluminado por luz natural.</p><p>Como a estação está integrada ao metrô, ônibus e aeroporto, tornou-se um dos principais centros de transporte de Portugal.</p><p>Chegue com alguma antecedência para localizar a plataforma, organizar as bagagens e embarcar sem pressa.</p><h4>Devolução do carro</h4><p>Depois de quase uma semana percorrendo o Algarve e o Alentejo, chega o momento de devolver o carro.</p><p>A escolha da locadora próxima ao Aeroporto Humberto Delgado torna essa etapa bastante simples. Após a devolução, basta utilizar o transporte da própria locadora ou um táxi de poucos minutos para retornar à Estação do Oriente.</p><h4>Alfa Pendular</h4><p>O Alfa Pendular é o serviço ferroviário mais rápido de Portugal.</p><p>Os trens atingem velocidades próximas de 220 km/h, oferecendo poltronas confortáveis, Wi-Fi, tomadas elétricas e um ambiente silencioso para descansar durante a viagem.</p><p>À medida que o trem avança para o norte, a paisagem alterna grandes planícies, áreas agrícolas, pequenas cidades e, mais próximo do Porto, vales cada vez mais verdes.</p><p>É um deslocamento bastante agradável e muito menos cansativo do que percorrer todo esse trajeto de automóvel.</p><h4>Ribeira e jantar</h4><p>A melhor maneira de terminar o dia é caminhando pela Ribeira.</p><p>À medida que o sol se põe, os edifícios coloridos refletem nas águas do Douro, enquanto a Ponte Luís I começa a ganhar uma iluminação especial.</p><p>As ruas estreitas enchem-se de músicos, turistas e moradores, criando uma atmosfera muito diferente daquela encontrada em Lisboa.</p><p>Escolha um restaurante à beira-rio para o primeiro jantar na cidade. Se ainda houver disposição, atravesse a ponte até Vila Nova de Gaia para apreciar a vista do casario iluminado refletido no Douro.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> No Airbnb ou cafeteria antes do check-out.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Parque das Nações: D&#x27;Bacalhau • Honorato • Portugália • Sea Me (Oriente).</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Estação do Oriente ou Alfa Pendular (café antes do embarque).</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Ribeira do Porto: Bacalhau • Postigo do Carvão • Adega São Nicolau.</p><p class=\"food-line\"><strong>Dica:</strong> as sugestões acompanham o percurso do dia para evitar deslocamentos desnecessários.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Do+Sol+do+Algarve+às+Margens+do+Douro+Portugal"}, "16": {"label": "D16", "title": "Porto Histórico", "region": "Porto", "map": "mapa_d16.png", "opening": "<p class=\"day-subtitle\">O Porto por Dentro e por Baixo</p><p>Depois de percorrer Lisboa, o Algarve e o interior de Portugal, chega o momento de conhecer uma cidade completamente diferente.</p><p>O Porto não impressiona apenas pelos seus monumentos, mas pela forma como foi construído. As ruas sobem e descem acompanhando o relevo, as fachadas parecem empilhar-se sobre a encosta e, em quase todos os caminhos, o rio Douro reaparece como protagonista da paisagem.</p><p>Este é um dia para caminhar. O centro histórico é compacto, e praticamente todas as atrações podem ser visitadas a pé. Ao longo do percurso você conhecerá igrejas monumentais, ruas medievais, edifícios comerciais que revelam a riqueza da cidade e alguns dos lugares mais fotografados de Portugal.</p><p>Mais do que visitar monumentos, este é um dia para compreender por que o Porto foi, durante séculos, a grande porta comercial portuguesa para o mundo.</p><p>Estação de São Bento</p><p>Poucas estações ferroviárias conseguem transformar uma simples chegada em uma experiência histórica.</p><p>Inaugurada em 1916, a Estação de São Bento ocupa o terreno onde existiu o antigo Mosteiro de São Bento de Avé-Maria. Seu grande destaque está no átrio principal, revestido por mais de vinte mil azulejos pintados pelo artista Jorge Colaço.</p><p>Reserve alguns minutos para observar os enormes painéis. Eles retratam episódios fundamentais da história portuguesa, como a Batalha de Valdevez, a entrada de D. João I no Porto e cenas da vida rural do norte do país. Não são apenas elementos decorativos: funcionam como um verdadeiro livro ilustrado da história de Portugal.</p><p>É uma das estações ferroviárias mais bonitas do mundo e uma excelente introdução à cidade.</p><p>Sé do Porto</p><p>No ponto mais elevado do centro histórico encontra-se a Sé, um dos monumentos mais antigos do Porto.</p><p>Sua construção começou no século XII, pouco depois da fundação do reino português, e ao longo dos séculos recebeu elementos românicos, góticos e barrocos, refletindo a evolução da arquitetura nacional.</p><p>Do terraço diante da catedral, aproveite para admirar uma das primeiras grandes vistas sobre o casario do Porto e o rio Douro. É fácil perceber como a cidade cresceu sobre as encostas, descendo em direção ao rio.</p><p>Antes de seguir, observe também o elegante claustro revestido por azulejos e a grande rosácea da fachada principal.</p>", "route": "<h4>Rua das Flores</h4><p>Hoje é uma das ruas mais agradáveis do Porto, mas durante muito tempo foi endereço da aristocracia e dos comerciantes mais influentes da cidade.</p><p>Enquanto caminha, observe as fachadas estreitas, as sacadas em ferro trabalhado e os antigos edifícios comerciais transformados em cafés, hotéis e pequenas lojas.</p><p>A Rua das Flores resume bem o espírito do Porto: tradição e modernidade convivendo naturalmente.</p><p>Vale a pena caminhar sem pressa. Muitas das melhores descobertas estão justamente nas pequenas galerias, nas lojas independentes e nos detalhes arquitetônicos escondidos entre uma fachada e outra.</p><h4>Torre dos Clérigos</h4><p>A Torre dos Clérigos é o grande símbolo vertical do Porto.</p><p>Projetada pelo arquiteto italiano Nicolau Nasoni no século XVIII, tornou-se durante muito tempo o ponto mais alto da cidade e servia como referência para navegadores que chegavam pelo rio Douro.</p><p>Quem decidir subir seus mais de duzentos degraus será recompensado por uma vista panorâmica de 360 graus. Dali é possível compreender perfeitamente a geografia do Porto, com o centro histórico espalhando-se pelas colinas até encontrar o rio.</p><p>Mesmo para quem não sobe, vale a pena admirar a imponência da torre e a rica decoração barroca da igreja.</p><h4>Livraria Lello</h4><p>Frequentemente citada entre as livrarias mais bonitas do mundo, a Livraria Lello tornou-se um dos lugares mais visitados do Porto.</p><p>Seu interior impressiona pela escadaria central em madeira, pelos vitrais coloridos e pelas estantes ricamente ornamentadas, criando um ambiente que parece saído de um romance de fantasia.</p><p>Embora exista a crença popular de que o espaço teria inspirado diretamente Harry Potter, essa relação nunca foi oficialmente confirmada pela autora. Ainda assim, a atmosfera realmente desperta a imaginação de qualquer visitante.</p><p>Como a procura costuma ser muito grande, comprar o ingresso antecipadamente pode economizar bastante tempo.</p><h4>Palácio da Bolsa</h4><p>Durante o século XIX, o Porto consolidou-se como um dos principais centros comerciais da Península Ibérica, e o Palácio da Bolsa tornou-se o símbolo desse período de prosperidade.</p><p>Construído pela Associação Comercial do Porto, o edifício impressiona tanto pela arquitetura quanto pela riqueza dos interiores.</p><p>O ponto alto da visita é o famoso Salão Árabe, inspirado na arquitetura do Palácio de Alhambra, em Granada. Seus detalhes dourados, arabescos e pinturas fazem dele uma das salas mais espetaculares de Portugal.</p><p>É um daqueles lugares que surpreendem muito mais por dentro do que pela fachada.</p><h4>Igreja de São Francisco</h4><p>Por fora, a igreja apresenta linhas relativamente discretas em estilo gótico.</p><p>Ao entrar, porém, o visitante encontra um dos interiores barrocos mais exuberantes da Europa. Calcula-se que mais de trezentos quilos de ouro tenham sido utilizados na decoração dos altares, colunas e talhas que revestem praticamente todo o templo.</p><p>Sob a igreja existe ainda um interessante conjunto de catacumbas, que pode ser visitado durante o percurso.</p><p>A riqueza artística do interior contrasta fortemente com a simplicidade da fachada e ajuda a compreender a importância econômica que o Porto alcançou durante os séculos XVII e XVIII.</p><h4>Ribeira</h4><p>Poucos lugares representam tão bem a identidade do Porto quanto a Ribeira.</p><p>Às margens do Douro, as casas estreitas e coloridas parecem apoiar-se umas nas outras, formando uma paisagem que se tornou Patrimônio Mundial da UNESCO.</p><p>Ao caminhar pelo cais, observe os tradicionais barcos rabelos, utilizados durante séculos para transportar os barris de vinho do Porto desde o Vale do Douro até as caves de Vila Nova de Gaia.</p><p>Da Ribeira também se tem uma das melhores perspectivas da Ponte Luís I, talvez a imagem mais emblemática da cidade.</p><p>No fim da tarde, quando a luz dourada ilumina as fachadas e se reflete sobre o rio, entende-se por que este é considerado um dos cenários urbanos mais bonitos da Europa.</p><h4>Jantar na Ribeira</h4><p>Encerrar o dia na Ribeira é quase uma tradição para quem visita o Porto.</p><p>Escolha uma mesa voltada para o rio, experimente um prato típico — como bacalhau, polvo ou uma boa francesinha — e aproveite o movimento constante de músicos de rua, moradores e visitantes.</p><p>Quando anoitece, a iluminação da Ponte Luís I transforma completamente a paisagem, refletindo-se nas águas do Douro e criando uma atmosfera difícil de esquecer.</p><p>É o encerramento perfeito para um dia dedicado a descobrir o coração histórico da cidade.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Mercador Café • Combi Coffee Roasters • Café ao lado da Estação de São Bento.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Rua das Flores/Ribeira: Cantina 32 • Taberna dos Mercadores • Brasão Aliados (alternativa).</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Moustache Coffee House • Nata Lisboa • Café Progresso.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Ribeira: Bacalhau • Postigo do Carvão • Adega São Nicolau.</p><p class=\"food-line\"><strong>Dica:</strong> todas as sugestões foram escolhidas para acompanhar o roteiro do dia, minimizando deslocamentos.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Porto+Histórico+Portugal"}, "17": {"label": "D17", "title": "Vale do Douro", "region": "Vale do Douro", "map": "mapa_d17.png", "opening": "<p class=\"day-subtitle\">Onde o homem desenhou a paisagem</p><p>Há paisagens bonitas. E há paisagens que contam uma história.</p><p>O Vale do Douro pertence à segunda categoria.</p><p>Durante mais de dois mil anos, gerações de agricultores transformaram encostas íngremes em milhares de socalcos sustentados por muros de pedra, criando uma das paisagens agrícolas mais extraordinárias do mundo. O resultado não impressiona apenas pela beleza, mas pelo trabalho humano necessário para torná-la possível.</p><p>Foi aqui que nasceu o Vinho do Porto e uma das primeiras regiões vinícolas oficialmente demarcadas do planeta, ainda no século XVIII. Hoje, o Douro é Patrimônio Mundial da UNESCO justamente por representar a perfeita integração entre natureza, agricultura e cultura.</p><p>Ao longo do dia, você conhecerá quintas históricas, navegará pelo rio que moldou toda essa região e entenderá por que o Douro é considerado uma das experiências mais marcantes de qualquer viagem a Portugal.</p>", "route": "<h4>Saída do Porto</h4><p>O dia começa cedo.</p><p>A excursão parte do Largo da Lapa, deixando para trás o ambiente urbano do Porto. Pouco a pouco, a paisagem muda. As cidades tornam-se menores, o relevo ganha altitude e os primeiros vinhedos começam a aparecer nas encostas.</p><p>A viagem até o coração do Douro leva cerca de duas horas, mas faz parte da experiência. É durante esse percurso que se percebe como o rio influencia toda a região norte de Portugal.</p><p>Quando os primeiros socalcos surgirem diante da janela, você entenderá que chegou a um lugar único.</p><h4>Primeira Quinta</h4><p>A palavra &quot;quinta&quot; designa uma propriedade rural, mas no Douro ela significa muito mais do que isso.</p><p>São fazendas históricas onde o cultivo da vinha acontece há séculos, muitas pertencendo às mesmas famílias por várias gerações.</p><p>Durante a visita, você conhecerá o ciclo completo da produção do vinho: o cultivo das videiras, a colheita das uvas, a fermentação, o envelhecimento e as características que tornam o Vinho do Porto diferente dos demais vinhos.</p><p>Na degustação, procure perceber como cada vinho apresenta aromas, intensidade e níveis de doçura distintos. Não se trata apenas de provar, mas de compreender uma tradição construída ao longo dos séculos.</p><h4>Almoço Regional</h4><p>A gastronomia do Douro nasceu para acompanhar seus vinhos.</p><p>Os pratos costumam ser generosos e valorizam ingredientes locais, como azeite, carnes, embutidos, queijos e legumes cultivados na própria região.</p><p>Durante o almoço, aproveite também a vista sobre os vinhedos. Poucos restaurantes oferecem uma integração tão harmoniosa entre paisagem e culinária.</p><p>É um momento de pausa antes da parte mais contemplativa do dia.</p><h4>Passeio de barco</h4><p>Ver o Douro da estrada é bonito.</p><p>Vê-lo do próprio rio é completamente diferente.</p><p>Durante séculos, foram as águas do Douro que transportaram os famosos barcos rabelos carregados de pipas de vinho até Vila Nova de Gaia, onde a bebida envelhecia antes de seguir para o restante da Europa.</p><p>Hoje a navegação é tranquila, mas permite compreender a geografia da região de uma forma impossível por terra. As encostas parecem ainda mais altas, os socalcos revelam seu desenho perfeito e pequenas quintas surgem escondidas entre os vinhedos.</p><p>É um dos momentos mais relaxantes de toda a viagem.</p><h4>Segunda Quinta</h4><p>Cada quinta possui sua própria personalidade.</p><p>Algumas priorizam métodos tradicionais; outras incorporam tecnologia moderna sem abandonar práticas centenárias. Essa segunda visita permite comparar diferentes formas de produzir vinhos e conhecer novos estilos de degustação.</p><p>Observe como pequenas diferenças de altitude, exposição ao sol e tipo de solo produzem características bastante distintas nos vinhos.</p><p>É justamente essa diversidade que faz do Douro uma das regiões vinícolas mais respeitadas do mundo.</p><h4>Miradouro Panorâmico</h4><p>Antes de regressar ao Porto, o roteiro faz uma última parada.</p><p>Os miradouros do Douro permitem observar, de uma só vez, aquilo que durante o dia foi sendo descoberto aos poucos: o rio serpenteando entre montanhas, os intermináveis socalcos desenhando as encostas e pequenas aldeias espalhadas pelo vale.</p><p>Reserve alguns minutos apenas para contemplar.</p><p>Poucas paisagens conseguem transmitir tão claramente a relação entre o homem e a natureza quanto esta.</p><p>Mesmo quem não aprecia vinho costuma considerar este um dos cenários mais bonitos de Portugal.</p><h4>Retorno ao Porto</h4><p>No caminho de volta, a sensação costuma ser diferente da ida.</p><p>Agora cada vinhedo visto pela janela tem uma história, cada quinta lembra uma degustação e cada curva do rio revela um trecho percorrido de barco.</p><p>Ao chegar novamente ao Porto, talvez você perceba que o Douro ofereceu muito mais do que vinhos. Ofereceu uma maneira diferente de compreender Portugal: um país cuja história também foi construída por agricultores, comerciantes e famílias que aprenderam a transformar uma paisagem difícil em uma das mais belas regiões vinícolas do mundo.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Café leve próximo ao Largo da Lapa antes do embarque.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Incluído no tour – cozinha regional duriense harmonizada com vinhos.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Degustações nas quintas; café opcional no retorno ao Porto.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Leve na Ribeira ou próximo ao Airbnb: Taberna Santo António • Casa Guedes • Tapabento (se houver disposição).</p><p class=\"food-line\"><strong>Dica:</strong> todas as sugestões foram escolhidas para acompanhar o roteiro do dia, minimizando deslocamentos.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Vale+do+Douro+Portugal"}, "18": {"label": "D18", "title": "Vila Nova de Gaia e a Foz do Douro", "region": "Porto & Gaia", "map": "mapa_d18.png", "opening": "<p class=\"day-subtitle\">Entre o rio e o oceano, uma despedida de Portugal</p><p>Toda viagem chega ao fim.</p><p>Depois de dezoito dias percorrendo cidades históricas, castelos, palácios, praias, montanhas, vinhedos e pequenas vilas, resta apenas uma última missão: desacelerar.</p><p>Toda viagem tem um momento em que deixamos de correr para conhecer lugares e passamos simplesmente a apreciá-los.</p><p>Este é esse momento.</p><p>Depois de percorrer boa parte de Portugal, este último dia no norte do país convida a caminhar sem pressa entre o Douro e o Atlântico. É um roteiro leve, feito para observar a cidade, sentir a brisa do oceano e guardar na memória tudo o que foi vivido nos últimos dias.</p><p>O rio que durante séculos levou o vinho do Porto até o mundo finalmente encontra o mar. É justamente nesse encontro que termina esta etapa da viagem.</p><p>Mais do que visitar atrações, hoje você irá apreciar paisagens, sabores e pequenos momentos. Afinal, algumas das melhores lembranças de uma viagem surgem quando deixamos o relógio de lado.</p>", "route": "<h4>Ponte Luís I</h4><p>Comece o dia atravessando um dos maiores símbolos de Portugal.</p><p>Projetada pelo engenheiro belga Théophile Seyrig, discípulo de Gustave Eiffel, a Ponte Luís I foi inaugurada em 1886 e rapidamente tornou-se um dos cartões-postais do Porto.</p><p>Enquanto atravessa o tabuleiro superior, pare algumas vezes para observar a paisagem. De um lado está o casario da Ribeira; do outro, as caves de Vila Nova de Gaia. Abaixo, o Douro segue tranquilamente em direção ao Atlântico.</p><p>É um dos melhores lugares para perceber como rio e cidade cresceram juntos ao longo dos séculos.</p><h4>Vila Nova de Gaia</h4><p>Embora muitos visitantes a considerem apenas uma extensão do Porto, Gaia possui identidade própria.</p><p>Foi aqui que, durante séculos, enormes armazéns receberam os barris vindos do Vale do Douro para o longo processo de envelhecimento do Vinho do Porto. As condições climáticas, mais estáveis do que no interior do vale, favoreciam essa etapa fundamental da produção.</p><p>Se ainda não visitou uma cave, esta é uma excelente oportunidade. Além da degustação, as visitas costumam explicar a história do vinho, os diferentes estilos e a importância econômica que essa bebida teve para Portugal.</p><p>Mesmo sem entrar em uma cave, caminhar pelo cais já vale a visita. A vista para o Porto, do outro lado do rio, é simplesmente magnífica.</p><h4>Almoço em Gaia</h4><p>Poucos lugares oferecem uma vista tão bonita para almoçar.</p><p>Escolha um restaurante voltado para o Douro e aproveite o ambiente sem pressa. Enquanto os barcos turísticos cruzam o rio e os visitantes caminham pelo cais, é fácil entender por que esta região se tornou um dos locais mais agradáveis da cidade.</p><p>É um bom momento para experimentar peixes frescos ou simplesmente brindar ao final da viagem com uma taça de vinho do Porto.</p><h4>Farol de Felgueiras</h4><p>Pouco a pouco o rio vai se alargando até finalmente encontrar o oceano.</p><p>No extremo da Foz do Douro está o Farol de Felgueiras, construído no século XIX para orientar as embarcações que chegavam ao Porto.</p><p>Quando o mar está agitado, as ondas quebram contra o molhe e muitas vezes envolvem completamente o farol, criando uma das imagens mais famosas da cidade. Em dias calmos, o lugar transmite exatamente o contrário: silêncio, vento e uma sensação de tranquilidade difícil de encontrar no centro urbano.</p><p>É um excelente ponto para fotografar e simplesmente observar o Atlântico.</p><h4>Passeio pela Avenida de Montevideu</h4><p>A Avenida de Montevideu acompanha a orla marítima em um dos passeios mais agradáveis do Porto.</p><p>Enquanto caminha, observe como a paisagem muda completamente em relação ao centro histórico. Em vez de ruas estreitas e edifícios centenários, surgem jardins, ciclovias, praias e amplos espaços abertos voltados para o mar.</p><p>É uma caminhada para ser feita sem destino, apenas apreciando o som das ondas e o vento vindo do Atlântico.</p><h4>Praia dos Ingleses / Praia do Carneiro</h4><p>Estas pequenas praias urbanas mostram um lado completamente diferente do Porto.</p><p>Mesmo que a temperatura não seja ideal para um mergulho, vale a pena sentar por alguns minutos na areia ou em um café à beira-mar e observar a rotina dos moradores.</p><p>Depois de tantos dias visitando monumentos, esse momento de pausa ajuda a perceber que conhecer um país também significa observar como as pessoas vivem seu cotidiano.</p><h4>Castelo do Queijo (Forte de São Francisco Xavier)</h4><p>Construído no século XVII sobre um afloramento rochoso junto ao mar, o Castelo do Queijo tinha a missão de proteger a entrada do Porto contra possíveis ataques vindos do Atlântico.</p><p>Seu nome curioso surgiu porque a rocha onde foi erguido lembrava um enorme queijo.</p><p>Além do interesse histórico, o forte oferece belas vistas da costa e da extensa praia de Matosinhos. Se houver tempo, vale a pena fazer uma rápida visita antes de seguir para a estação.</p><h4>APÊNDICES</h4><p>Cronologia resumida de Portugal</p><p>Personagens importantes</p><p>Glossário</p><p>Gastronomia Portuguesa</p><p>Vinhos Portugueses</p><p>Música para entrar no clima</p><p>Bibliografia</p><p>Créditos das imagens</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Próximo ao Airbnb: Mercador Café • 7g Roaster.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Cais de Gaia: Vinum • Bacalhau • Ar de Rio.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Foz do Douro: Café na Avenida Montevideu ou esplanada junto ao Farol de Felgueiras.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Antes do Alfa Pendular: retorno à Baixa ou Campanhã para refeição leve – Café Santiago Express • Casa Guedes.</p><p class=\"food-line\"><strong>Dica:</strong> todas as sugestões foram escolhidas para acompanhar o roteiro do dia, minimizando deslocamentos.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Vila+Nova+de+Gaia+e+a+Foz+do+Douro+Portugal"}}};const MAP_HOTSPOTS={

function renderMap(d,n){const fig=document.getElementById('dayMap'),pts=MAP_HOTSPOTS[n]||[];fig.classList.toggle('no-hotspots',!pts.length);const fallback=`mapa_d${n}.png`;fig.innerHTML=`<img id="activeMapImg" src="${d.map}" data-fallback="${fallback}" alt="Mapa ${d.label} — ${d.title}"><div class="map-hotspots">${pts.map((p,i)=>`<button class="map-hotspot" data-index="${i}" style="left:${p[0]*100}%;top:${p[1]*100}%" type="button" aria-label="Abrir o texto do ponto ${i+1}" onclick="showPoint(${i},this)">${i+1}</button>`).join('')}</div><span class="map-hint">Toque nos números do quadro</span>`;const img=document.getElementById('activeMapImg');img.addEventListener('error',()=>{if(!img.dataset.tried){img.dataset.tried='1';img.src=img.dataset.fallback}else{fig.innerHTML=`<div class="map-error">Mapa não encontrado<small>Esperado: ${d.map}. Confira o nome do arquivo no GitHub.</small></div>`}},{once:false})}
const HOME_ORDER=['lisboa','sintra','nazare','obidos','fatima','evora','algarve','porto','douro'];const BUTTONS={lisboa:'bt_lisboa.png',sintra:'bt_sintra.png',nazare:'bt_nazare.png',obidos:'bt_obidos.png',fatima:'bt_fatima.png',evora:'bt_evora.png',algarve:'bt_algarve.png',porto:'bt_porto.png',douro:'bt_douro.png'};let currentCity=null,currentDay=null;
function screen(n){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('screen-'+n).classList.add('active');window.scrollTo(0,0)}
function renderHome(){document.getElementById('cityGrid').innerHTML=HOME_ORDER.map(k=>`<button class="city-btn ${k==='douro'?'douro-wide':''}" onclick="openCity('${k}')" aria-label="Abrir ${APP_DATA.cities[k].name}"><img src="${BUTTONS[k]}" alt="${APP_DATA.cities[k].name}"></button>`).join('')}
function goHome(){currentCity=null;currentDay=null;screen('home')}
function openCity(k){currentCity=k;const c=APP_DATA.cities[k];document.getElementById('cityTitle').textContent=c.name;document.getElementById('cityStay').textContent=c.stay;document.getElementById('dayList').innerHTML=c.days.map(n=>{const d=APP_DATA.days[n];return `<button class="day-card" onclick="openDay(${n})"><span class="badge">${d.label}</span><strong>${d.title}</strong><span class="arrow">→</span></button>`}).join('');screen('city')}
function openDay(n){currentDay=n;const d=APP_DATA.days[n];document.getElementById('dayLabel').textContent=d.region+' · '+d.label;document.getElementById('dayTitle').textContent=d.title;document.getElementById('openingText').innerHTML=d.opening;document.getElementById('openingText').hidden=true;document.getElementById('guideTitle').setAttribute('aria-expanded','false');renderMap(d,n);document.getElementById('routeContent').innerHTML=d.route;buildPointButtons(d.route);document.getElementById('foodContent').innerHTML=d.food;setupFoodFilters();document.getElementById('mapsLink').href=d.gmaps;updateDayControls(n,window.currentRouteSections||[]);document.querySelectorAll('.content-card').forEach(x=>x.classList.remove('open'));document.getElementById('selectedPoint').classList.remove('open');document.getElementById('selectedPoint').innerHTML='';document.querySelectorAll('.act[data-panel]').forEach(x=>x.classList.remove('active'));screen('day')}
function splitRouteSections(routeHtml){const box=document.createElement('div');box.innerHTML=routeHtml;const sections=[];let current=null;[...box.children].forEach(el=>{if(el.tagName==='H4'){current={title:el.textContent.trim(),html:el.outerHTML};sections.push(current)}else if(current){current.html+=el.outerHTML}});return sections}
function buildPointButtons(routeHtml){const sections=splitRouteSections(routeHtml);const wrap=document.getElementById('pointButtons');wrap.innerHTML=sections.map((s,i)=>`<button class="point-btn" type="button" aria-label="Abrir ponto ${i+1}: ${s.title.replace(/"/g,'&quot;')}" onclick="showPoint(${i},this)">${i+1}</button>`).join('')+`<button class="point-btn all" type="button" onclick="showAllRoute(this)">Todos</button>`;window.currentRouteSections=sections}
function showPoint(index,btn){const sections=window.currentRouteSections||[];const sec=sections[index];if(!sec)return;document.querySelectorAll('.point-btn,.map-hotspot').forEach(x=>x.classList.remove('active'));document.querySelectorAll(`[data-index="${index}"]`).forEach(x=>x.classList.add('active'));document.querySelectorAll('.content-card').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.act[data-panel]').forEach(x=>x.classList.remove('active'));const card=document.getElementById('selectedPoint');card.innerHTML=`<div class="selected-point-head"><h3><span class="badge" style="display:inline-grid;vertical-align:middle;margin-right:9px;width:38px;height:38px">${index+1}</span>${sec.title}</h3><div class="point-tools"><button class="mini-btn favorite ${isFavorite(currentDay,index)?'active':''}" type="button" onclick="togglePointFavorite(${index})">${isFavorite(currentDay,index)?'★ Salvo':'☆ Favoritar'}</button><a class="mini-btn" href="${pointMapsUrl(sec.title)}" target="_blank" rel="noopener">📍 Maps</a></div></div>${sec.html.replace(/^<h4[^>]*>.*?<\/h4>/s,'')}`;card.classList.add('open');setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'start'}),40)}
function showAllRoute(btn){document.querySelectorAll('.point-btn,.map-hotspot').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('selectedPoint').classList.remove('open');const routeBtn=document.querySelector('.act[data-panel="route"]');showPanel('route',routeBtn)}
function toggleOpening(){const box=document.getElementById('openingText'),btn=document.getElementById('guideTitle'),open=box.hidden;box.hidden=!open;btn.setAttribute('aria-expanded',String(open));if(open)setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function showPanel(n,b){document.getElementById('selectedPoint').classList.remove('open');document.querySelectorAll('.point-btn,.map-hotspot').forEach(x=>x.classList.remove('active'));const t=document.getElementById('panel-'+n),was=t.classList.contains('open');document.querySelectorAll('.content-card').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.act[data-panel]').forEach(x=>x.classList.remove('active'));if(!was){t.classList.add('open');b.classList.add('active');setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'start'}),40)}}

function getFavorites(){try{return JSON.parse(localStorage.getItem('portugal2026_favorites')||'[]')}catch(e){return[]}}
function saveFavorites(items){localStorage.setItem('portugal2026_favorites',JSON.stringify(items));updateFavoriteCount();renderFavorites()}
function favoriteKey(day,index){return `${day}:${index}`}
function isFavorite(day,index){return getFavorites().some(x=>x.key===favoriteKey(day,index))}
function togglePointFavorite(index){const sections=window.currentRouteSections||[],sec=sections[index];if(!sec)return;let items=getFavorites(),key=favoriteKey(currentDay,index);if(items.some(x=>x.key===key))items=items.filter(x=>x.key!==key);else items.push({key,day:currentDay,index,title:sec.title,region:APP_DATA.days[currentDay].region});saveFavorites(items);showPoint(index,document.querySelector(`.point-btn:nth-child(${index+1})`))}
function updateFavoriteCount(){const n=getFavorites().length;const chip=document.getElementById('favCountChip');if(chip)chip.innerHTML=`<strong>${n}</strong> favoritos`;document.getElementById('favoritesBtn')?.classList.toggle('active',n>0)}
function renderFavorites(){const box=document.getElementById('favoriteList'),items=getFavorites();if(!box)return;box.innerHTML=items.length?items.map(x=>`<div class="favorite-item"><button type="button" onclick="openFavorite(${x.day},${x.index})"><strong>${APP_DATA.days[x.day].label} · ${x.title}</strong><br><small>${x.region}</small></button><button class="mini-btn" type="button" onclick="removeFavorite('${x.key}')">Remover</button></div>`).join(''):'<p class="favorite-empty">Nenhum ponto favorito ainda. Abra um ponto e toque em ☆ Favoritar.</p>'}
function removeFavorite(key){saveFavorites(getFavorites().filter(x=>x.key!==key))}
function openFavorite(day,index){document.getElementById('favoritesPanel').classList.remove('open');openDay(day);setTimeout(()=>showPoint(index,document.querySelector(`.point-btn:nth-child(${index+1})`)),80)}
function toggleFavoritesPanel(){document.getElementById('favoritesPanel').classList.toggle('open');renderFavorites();window.scrollTo({top:0,behavior:'smooth'})}
function applyTheme(theme){document.body.classList.toggle('dark',theme==='dark');document.getElementById('themeBtn').textContent=theme==='dark'?'☀':'☾';localStorage.setItem('portugal2026_theme',theme)}
function toggleTheme(){applyTheme(document.body.classList.contains('dark')?'light':'dark')}
function populateDaySelect(){const sel=document.getElementById('daySelect');sel.innerHTML=Object.keys(APP_DATA.days).map(n=>`<option value="${n}">${APP_DATA.days[n].label} — ${APP_DATA.days[n].title}</option>`).join('');sel.addEventListener('change',e=>openDay(Number(e.target.value)));document.getElementById('prevDayBtn').addEventListener('click',()=>currentDay>1&&openDay(currentDay-1));document.getElementById('nextDayBtn').addEventListener('click',()=>currentDay<18&&openDay(currentDay+1))}
function updateDayControls(n,sections){document.getElementById('daySelect').value=String(n);document.getElementById('prevDayBtn').disabled=n<=1;document.getElementById('nextDayBtn').disabled=n>=18;document.getElementById('dayProgress').style.width=`${n/18*100}%`;document.getElementById('pointCount').textContent=sections.length}
function setupFoodFilters(){const box=document.getElementById('foodContent'),lines=[...box.querySelectorAll('.food-line')];if(!lines.length)return;const cats=[['todos','Todos'],['café','Café'],['almoço','Almoço'],['jantar','Jantar'],['dica','Dicas']];const nav=document.createElement('div');nav.className='food-filters';nav.innerHTML=cats.map((c,i)=>`<button class="food-filter ${i===0?'active':''}" type="button" data-filter="${c[0]}">${c[1]}</button>`).join('');box.insertBefore(nav,box.children[1]||box.firstChild);nav.addEventListener('click',e=>{const b=e.target.closest('.food-filter');if(!b)return;nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;lines.forEach(line=>line.classList.toggle('food-hidden',f!=='todos'&&!line.textContent.toLowerCase().includes(f)))})}
function openFoodPanel(){const b=document.querySelector('.act[data-panel="food"]');showPanel('food',b)}
function pointMapsUrl(title){const d=APP_DATA.days[currentDay];return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title+' '+d.region+' Portugal')}`}
document.getElementById('themeBtn').addEventListener('click',toggleTheme);document.getElementById('favoritesBtn').addEventListener('click',toggleFavoritesPanel);applyTheme(localStorage.getItem('portugal2026_theme')||'light');populateDaySelect();renderFavorites();updateFavoriteCount();
function backToCity(){currentCity?openCity(currentCity):goHome()}renderHome();</script></body></html>
