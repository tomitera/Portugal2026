margin-left:auto;color:var(--azul2);font-size:20px}.day-head{background:var(--claro);border-bottom:1px solid var(--areia);padding:15px 16px}.day-head small{display:block;text-align:center;color:var(--suave);letter-spacing:2px;text-transform:uppercase}.guide-title{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;background:none;color:var(--azul);cursor:pointer;padding:6px 4px 2px}.guide-title h1{font-size:20px;font-weight:400;letter-spacing:.7px;line-height:1.25}.chevron{font-size:18px;transition:transform .25s}.guide-title[aria-expanded="true"] .chevron{transform:rotate(180deg)}.opening{margin:14px 16px 4px;border:1px solid var(--areia);border-left:4px solid var(--terra);background:#fff;border-radius:var(--r);padding:17px 18px;box-shadow:var(--sombra)}.opening[hidden]{display:none}.opening p,.content-card p{font-size:15px;line-height:1.68;margin-bottom:12px}.opening p:last-child,.content-card p:last-child{margin-bottom:0}.day-subtitle{font-size:16px!important;color:var(--terra);font-style:italic;font-weight:bold}.map-wrap{margin:15px 16px;border-radius:var(--r);overflow:hidden;border:1px solid var(--areia);background:var(--claro);box-shadow:var(--sombra)}.map-wrap img{display:block;width:100%;height:auto}.actions{padding:0 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.act{border:1px solid var(--areia);border-radius:var(--r);background:#fff;padding:13px 10px;box-shadow:var(--sombra);cursor:pointer;color:var(--texto);text-decoration:none;text-align:center}.act.full{grid-column:1/-1}.act.active{border-color:var(--azul2);background:#eef5f8;color:var(--azul)}.detail{padding:0 16px 95px}.content-card{display:none;border:1px solid var(--areia);border-radius:var(--r);padding:18px;background:#fff;box-shadow:var(--sombra)}.content-card.open{display:block;animation:fade .22s ease}.content-card h3{color:var(--azul);font-size:19px;margin-bottom:13px}.content-card h4{color:var(--azul);font-size:16px;margin:20px 0 8px;padding-top:4px;border-top:1px solid #eee}.content-card h4:first-child{margin-top:0;border-top:0}.food-line{padding:8px 0;border-bottom:1px solid #eee;margin:0!important}.food-line:last-child{border-bottom:0}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(853px,100%);display:flex;z-index:20;background:rgba(254,252,249,.97);border-top:1px solid var(--areia);padding:10px 14px max(10px,env(safe-area-inset-bottom));gap:10px}.footer button{flex:1;border:1px solid var(--areia);background:white;border-radius:12px;padding:11px;color:var(--azul);cursor:pointer}.point-nav{margin:0 16px 15px;padding:14px;border:1px solid var(--areia);border-radius:var(--r);background:#fff;box-shadow:var(--sombra)}.point-nav-title{font-size:13px;color:var(--suave);text-align:center;margin-bottom:10px;font-style:italic}.point-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.point-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--azul);background:var(--azul);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.13)}.point-btn:active{transform:scale(.96)}.point-btn.active{background:var(--terra);border-color:var(--terra)}.point-btn.all{width:auto;border-radius:22px;padding:0 15px;background:#fff;color:var(--azul)}.selected-point{display:none;border:1px solid var(--areia);border-left:4px solid var(--azul);border-radius:var(--r);padding:18px;background:#fff;box-shadow:var(--sombra);margin-bottom:12px}.selected-point.open{display:block;animation:fade .22s ease}.selected-point h3{color:var(--azul);font-size:19px;margin-bottom:12px}.selected-point p{font-size:15px;line-height:1.68;margin-bottom:12px}.selected-point p:last-child{margin-bottom:0}@media(max-width:430px){.city-grid{padding:0 36px;gap:11px 15px}.guide-title h1{font-size:18px}.actions{gap:8px}.act{font-size:13px}}@media(min-width:854px){body{border-left:1px solid #eee;border-right:1px solid #eee}}.map-wrap{position:relative}.map-hotspots{position:absolute;inset:0;po <section id="screen-home" class="screen active"><img class="home-bg-img" src="home_bg.png" alt="Portugal 2026 — Um Companheiro de Viagem"><div class="city-grid" id="cityGrid"></div></section>
<section id="screen-city" class="screen"><header class="topbar"><h2 id="cityTitle"></h2><p id="cityStay"></p></header><button class="back" onclick="goHome()">← Voltar para Portugal</button><main class="day-list" id="dayList"></main><div class="footer"><button onclick="goHome()">🏠 Home</button></div></section>
<section id="screen-day" class="screen"><div class="day-progress"><span id="dayProgress"></span></div><div class="day-switcher"><button id="prevDayBtn" type="button" aria-label="Dia anterior">←</button><select id="daySelect" aria-label="Escolher dia"></select><button id="nextDayBtn" type="button" aria-label="Próximo dia">→</button></div><div class="quick-status"><span class="status-chip"><strong id="pointCount">0</strong> pontos</span><span class="status-chip" id="favCountChip"><strong>0</strong> favoritos</span><span class="status-chip">uso offline após carregar</span></div><header class="day-head"><small id="dayLabel"></small><button class="guide-title" id="guideTitle" aria-expanded="false" aria-controls="openingText" onclick="toggleOpening()"><h1 id="dayTitle"></h1><span class="chevron">⌄</span></button></header><section id="openingText" class="opening" hidden></section><figure class="map-wrap" id="dayMap"></figure><section class="point-nav" id="pointNav"><p class="point-nav-title">Toque em um número do quadro do dia para ler o texto correspondente</p><div class="point-buttons" id="pointButtons"></div></section><nav class="actions"><button class="act" data-panel="route" onclick="showPanel('route',this)">📖 Roteiro</button><button class="act" data-panel="food" onclick="showPanel('food',this)">🍽️ Gastronomia</button><button class="act full" onclick="toggleOpening()">✨ Texto de abertura</button><a class="act full" id="mapsLink" target="_blank" rel="noopener">📍 Abrir pesquisa no Google Maps</a></nav><main class="detail"><article class="selected-point" id="selectedPoint"></article><article class="content-card" id="panel-route"><h3>Roteiro do dia</h3><div id="routeContent"></div></article><article class="content-card" id="panel-food"><div id="foodContent"></div></article></main><div class="footer"><button onclick="backToCity()">← Dias</button><button onclick="goHome()">🏠 Home</button></div><p class="offline-note">Dica: abra os dias uma vez com internet para manter as imagens no cache do navegador.</p><nav class="bottom-nav" aria-label="Navegação rápida"><button type="button" onclick="goHome()"><span>⌂</span>Home</button><button type="button" onclick="showAllRoute(document.querySelector('.point-btn.all'))"><span>☷</span>Roteiro</button><button type="button" onclick="openFoodPanel()"><span>♨</span>Comer</button><button type="button" onclick="toggleFavoritesPanel()"><span>★</span>Favoritos</button></nav></section><script>const APP_DATA={"cities": {"lisboa": {"name": "Lisboa", "stay": "D1 a D6", "days": [1, 2, 3, 4, 5, 6]}, "sintra": {"name": "Sintra", "stay": "D7 e D8", "days": [7, 8]}, "nazare": {"name": "Nazaré", "stay": "D9", "days": [9]}, "obidos": {"name": "Óbidos", "stay": "D9", "days": [9]}, "fatima": {"name": "Fátima", "stay": "D10", "days": [10]}, "evora": {"name": "Évora", "stay": "D10 e D11", "days": [10, 11]}, "algarve": {"name": "Algarve", "stay": "D12 a D14", "days": [12, 13, 14]}, "porto": {"name": "Porto", "stay": "D15, D16 e D18", "days": [15, 16, 18]}, "douro": {"name": "Douro", "stay": "D17", "days": [17]}}, "days": {"1": {"label": "D1", "title": "A Lisboa que renasceu", "region": "Lisboa", "map": "mapa_d01.png", "opening": "<p class=\"day-subtitle\">Quando uma tragédia mudou a história de uma cidade</p><p>Há cidades que carregam sua história em monumentos. Lisboa a carrega nas próprias ruas.</p><p>Em 1º de novembro de 1755, Dia de Todos os Santos, a capital portuguesa foi atingida por um dos maiores desastres naturais da história da Europa. Um violento terremoto abalou a cidade, seguido por um maremoto e por incêndios que se espalharam durante dias. Grande parte de Lisboa desapareceu.</p><p>A tragédia, porém, marcou também o início de uma extraordinária reconstrução. Sob a liderança do Marquês de Pombal, a cidade foi praticamente redesenhada. Ruas estreitas deram lugar a amplas avenidas, quarteirões passaram a obedecer a um planejamento rigoroso e surgiram técnicas inovadoras de construção capazes de resistir a novos terremotos.</p><p>A Lisboa que hoje encanta milhões de visitantes nasceu dessa reconstrução. Percorrer a Baixa Pombalina é compreender como uma cidade transformou destruição em oportunidade e conseguiu reinventar sua identidade sem romper com o passado.</p>", "route": "<h4>Avenida da Liberdade</h4><p>Você está iniciando seu passeio pela avenida mais elegante de Lisboa. Inaugurada no final do século XIX, ela foi inspirada nos grandes boulevards de Paris e marcou a expansão da cidade para além da antiga Baixa Pombalina.</p><p>Enquanto caminha, observe as largas calçadas em pedra portuguesa, os jardins centrais e as árvores que oferecem sombra durante quase todo o percurso. Ao longo da avenida estão hotéis históricos, cafés tradicionais e algumas das principais lojas de luxo de Portugal.</p><p>A Avenida da Liberdade representa a Lisboa moderna que surgiu mais de um século após a reconstrução provocada pelo terremoto de 1755.</p><h4>Praça dos Restauradores</h4><p>Esta praça celebra um dos acontecimentos mais importantes da história de Portugal: a Restauração da Independência, em 1640, quando o país voltou a ser uma nação independente após sessenta anos de domínio espanhol.</p><p>No centro da praça está o Obelisco dos Restauradores. Observe os relevos em bronze na sua base: eles representam a Vitória e a Liberdade, símbolos da recuperação da soberania portuguesa.</p><p>Olhe também ao redor. Os edifícios que cercam a praça mostram diferentes estilos arquitetônicos e marcam a transição entre a Lisboa do século XIX e a Baixa reconstruída após o terremoto.</p><h4>Rossio (Praça Dom Pedro IV)</h4><p>Durante séculos, esta foi a principal praça pública de Lisboa. Aqui aconteceram celebrações, mercados, manifestações populares, autos da Inquisição e acontecimentos que marcaram profundamente a história da cidade.</p><p>Observe primeiro a coluna central, onde está a estátua de D. Pedro IV, imperador do Brasil e rei de Portugal. Embora muitos lisboetas acreditassem, por muitos anos, que a estátua representava D. Pedro V, ela homenageia o responsável pela Carta Constitucional portuguesa de 1826.</p><p>Em seguida, olhe para o belíssimo edifício do Teatro Nacional D. Maria II. Sua fachada neoclássica domina a praça e simboliza o renascimento cultural de Portugal no século XIX.</p><p>Antes de seguir, repare na famosa calçada portuguesa em ondas. O desenho tornou-se uma das marcas registradas de Lisboa e hoje é reproduzido em diversas cidades do mundo.</p><h4>Rua Augusta</h4><p>A principal rua de pedestres da Baixa Pombalina. Após o terremoto de 1755, toda esta região foi reconstruída segundo um plano urbano inovador para a época, com ruas largas, quarteirões regulares e edifícios padronizados.</p><p>Enquanto caminha, observe como praticamente todos os prédios mantêm alturas semelhantes e fachadas harmoniosas. Essa uniformidade fazia parte do projeto liderado pelo Marquês de Pombal para tornar Lisboa mais organizada e segura.</p><p>Hoje, a Rua Augusta é um dos locais mais animados da cidade, repleta de artistas de rua, cafés, restaurantes e lojas.</p><h4>Arco da Rua Augusta</h4><p>O Arco da Rua Augusta é muito mais do que um portal monumental. Ele simboliza a reconstrução de Lisboa após a maior tragédia de sua história.</p><p>Observe as esculturas no topo. A figura central representa a Glória coroando o Gênio e o Valor. Ao redor estão personagens fundamentais da história portuguesa, como Vasco da Gama, o Marquês de Pombal e Viriato.</p><p>Se decidir subir ao mirante, será recompensado com uma das melhores vistas da Baixa Pombalina, da Praça do Comércio e do rio Tejo. Dali é possível compreender o traçado geométrico criado durante a reconstrução da cidade.</p><h4>Praça do Comércio</h4><p>O coração da Lisboa reconstruída.</p><p>Antes do terremoto de 1755, exatamente neste local existia o magnífico Palácio Real, conhecido como Paço da Ribeira. Era dali que os reis portugueses governavam o império ultramarino. O terremoto, seguido por um tsunami e um grande incêndio, destruiu completamente o palácio e toda a região.</p><p>A praça atual foi projetada como símbolo do renascimento de Lisboa e tornou-se uma das maiores praças abertas da Europa.</p><p>Comece observando a imponente estátua equestre de D. José I. Ela homenageia o rei durante cujo reinado ocorreu a reconstrução da cidade.</p><p>Depois caminhe até o Cais das Colunas. Durante séculos, era por ali que desembarcavam reis, diplomatas e viajantes que chegavam pelo rio Tejo. Imagine que, antes da existência dos grandes terminais modernos, esta era a porta de entrada de Lisboa.</p><p>Antes de seguir o roteiro, pare por alguns instantes e olhe ao redor. Os edifícios amarelos, o Arco da Rua Augusta às suas costas e o Tejo à sua frente resumem a transformação de Lisboa: uma cidade destruída pela natureza que conseguiu renascer como uma das capitais mais modernas da Europa do século XVIII.</p><p>detalhes decorativos fazem referência ao período das Grandes Navegações, reforçando o orgulho português por sua história marítima.</p><p>É também daqui que partem os trens para Sintra, lembrando que a estação continua desempenhando um papel importante na vida da cidade.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Hotel ou cafeteria na Av. da Liberdade.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Baixa/Chiado: Nicolau Lisboa • Café Lisboa • O Arco.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Manteigaria (pastel de nata) ou Confeitaria Nacional.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Solar dos Presuntos • Cervejaria Ribadouro • Gambrinus.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=A+Lisboa+que+renasceu+Portugal"}, "2": {"label": "D2", "title": "Alfama", "region": "Lisboa", "map": "mapa_d02.png", "opening": "<p class=\"day-subtitle\">A cidade que sobreviveu ao tempo</p><p>Se a Baixa Pombalina representa a Lisboa reconstruída após o terremoto de 1755, Alfama preserva uma cidade muito mais antiga. É aqui que Lisboa revela suas origens.</p><p>Ao longo dos séculos, romanos, visigodos, mouros e cristãos ocuparam estas colinas, deixando marcas que ainda hoje podem ser percebidas nas ruas estreitas, nas escadarias, nos becos e nos pequenos largos que parecem desafiar qualquer planejamento urbano. Poucos bairros europeus conseguiram preservar de forma tão autêntica o traçado de uma cidade medieval.</p><p>Ao contrário da Baixa, desenhada com régua e esquadro após o terremoto, Alfama cresceu lentamente, adaptando-se ao relevo e às necessidades de seus habitantes. Curiosamente, foi justamente essa geografia que ajudou o bairro a sobreviver ao desastre de 1755. Construído sobre uma base rochosa mais estável, sofreu danos muito menores do que o restante da cidade.</p><p>Percorrer Alfama é descobrir uma Lisboa que resistiu ao tempo. Aqui, a história não está apenas nos monumentos, mas também nas ruas, nas casas, nas pequenas praças e na vida cotidiana que continua acontecendo entre paredes erguidas há muitos séculos.</p>", "route": "<h4>Sé de Lisboa</h4><p>Poucos edifícios contam tão bem a origem de Portugal quanto a Sé de Lisboa.</p><p>Sua construção começou logo após a conquista de Lisboa por D. Afonso Henriques, em 1147, quando os cristãos retomaram a cidade que permanecera sob domínio muçulmano por mais de quatro séculos. Erguida sobre o local onde existia a principal mesquita da cidade, a catedral tornou-se símbolo da nova ordem política e religiosa que marcaria os primeiros anos do reino português.</p><p>Antes de entrar, afaste-se alguns metros e observe sua fachada. As duas torres robustas, as grossas paredes e as pequenas aberturas fazem a igreja lembrar uma fortaleza. Não é coincidência. Naquela época, Lisboa ainda precisava defender-se de possíveis ataques, e muitos edifícios religiosos também desempenhavam funções defensivas.</p><p>Ao longo de quase nove séculos, terremotos, incêndios e sucessivas reconstruções modificaram parte da estrutura original. Mesmo assim, a Sé preserva importantes elementos da arquitetura românica, como o grande rosáceo central. Sob o piso da catedral, escavações arqueológicas revelaram vestígios romanos, islâmicos e medievais, mostrando que este local reúne quase dois mil anos de história.</p><h4>Alfama</h4><p>Poucos bairros europeus preservaram tão bem sua identidade quanto Alfama.</p><p>Seu nome deriva da palavra árabe Al-hamma, que significa &quot;as fontes&quot; ou &quot;os banhos&quot;, lembrando o longo período em que Lisboa esteve sob domínio muçulmano. Ainda hoje, suas ruas seguem praticamente o mesmo traçado de muitos séculos atrás.</p><p>Aqui, perder-se faz parte da experiência. As ruas estreitas nunca foram planejadas para carruagens ou automóveis. Foram moldadas pelo relevo, pelas necessidades dos moradores e pela busca por sombra durante os verões quentes.</p><p>Enquanto caminha, observe os pequenos detalhes: roupas secando nas janelas, vasos de flores, portas antigas revestidas de azulejos, escadarias de pedra e moradores conversando à porta de casa. Imagine artesãos trabalhando com as portas abertas, pescadores regressando do Tejo e mercadores vindos do Mediterrâneo. Em Alfama, a vida cotidiana continua sendo parte do patrimônio histórico.</p><h4>Miradouro de Santa Luzia</h4><p>Poucos lugares traduzem tão bem a essência de Lisboa quanto este miradouro.</p><p>Coberto por buganvílias durante boa parte do ano, ele oferece uma vista privilegiada sobre os telhados de Alfama e o amplo estuário do Tejo. Daqui é fácil compreender por que a cidade sempre manteve uma ligação tão estreita com o rio.</p><p>Antes de apreciar a paisagem, aproxime-se dos grandes painéis de azulejos que decoram o terraço. Um deles retrata a Praça do Comércio antes do terremoto de 1755; outro representa a conquista cristã de Lisboa em 1147. Compare essas imagens com os lugares que você já percorreu. Elas ajudam a visualizar a transformação da cidade ao longo dos séculos.</p><p>Depois volte-se para o horizonte. Observe o emaranhado de telhados avermelhados, as torres das igrejas surgindo entre as casas e o Tejo ao fundo. Poucos lugares conseguem resumir tão bem a identidade de Lisboa.</p><h4>Castelo de São Jorge</h4><p>Muito antes de existir Portugal, esta colina já era considerada o ponto mais estratégico de Lisboa.</p><p>Romanos construíram aqui as primeiras fortificações. Os mouros ampliaram suas muralhas e transformaram o local no principal sistema defensivo da cidade. Após a conquista cristã, o castelo tornou-se residência da monarquia portuguesa durante vários séculos.</p><p>Caminhe pelas muralhas sempre que possível. Dali, compreende-se imediatamente por que Lisboa nasceu neste ponto. O Tejo oferecia proteção, abastecimento, comércio e ligação direta com o Atlântico. Quem controlava esta colina controlava praticamente toda a cidade.</p><p>Enquanto observa a paisagem, imagine sentinelas vigiando embarcações que se aproximavam pelo rio. Durante séculos, este foi o principal posto de observação de Lisboa. Hoje, o castelo oferece uma das vistas mais completas da capital portuguesa, reunindo em um único panorama Alfama, a Baixa Pombalina, o Tejo e a expansão moderna da cidade.</p><h4>Miradouro da Graça</h4><p>Este é um dos melhores lugares para encerrar o passeio por Alfama.</p><p>Daqui, Lisboa parece revelar todas as suas camadas. À frente estão os telhados de Alfama. À esquerda, o Castelo de São Jorge domina a colina onde a cidade nasceu. Ao fundo, o Tejo recorda que foi o rio, muito antes do oceano, que moldou a história de Portugal.</p><p>Reserve alguns minutos para identificar os lugares que você percorreu ao longo do dia. A Sé, Santa Luzia, as ruas sinuosas de Alfama e o Castelo agora fazem parte de uma única paisagem. Vista deste ponto, Lisboa deixa de ser apenas uma sequência de monumentos e passa a ser compreendida como uma cidade construída ao longo de muitos séculos.</p><p>Ao deixar Alfama, talvez você perceba que conheceu muito mais do que um bairro histórico. Conheceu a Lisboa que resistiu ao tempo. Enquanto a cidade ao redor mudou inúmeras vezes, estas ruas preservaram a memória de quase nove séculos de história. É por isso que, para muitos lisboetas, Alfama não é apenas um bairro: é a alma de Lisboa.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Café próximo à Sé de Lisboa.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Santo André • Pois Café • Cruzes Credo.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Fábrica Coffee Roasters (Alfama) ou pequeno café local.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Clube de Fado ou restaurante tradicional de Alfama.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Alfama+Portugal"}, "3": {"label": "D3", "title": "Belém", "region": "Lisboa", "map": "mapa_d03.png", "opening": "<p class=\"day-subtitle\">Onde Portugal encontrou o mundo</p><p>Se Alfama conta a origem de Lisboa, Belém narra o momento em que Portugal mudou a história da humanidade.</p><p>Foi daqui que partiram navegadores que atravessaram oceanos ainda desconhecidos pelos europeus. Durante os séculos XV e XVI, Belém tornou-se a principal porta de saída das grandes expedições marítimas. Vasco da Gama partiu rumo à Índia. Pedro Álvares Cabral iniciou a viagem que levaria ao descobrimento do Brasil. Fernão de Magalhães deu início à primeira circum-navegação do planeta.</p><p>A riqueza trazida pelo comércio das especiarias transformou Portugal em uma das maiores potências do mundo. Igrejas, mosteiros, fortalezas e monumentos erguidos às margens do Tejo celebram até hoje essa época conhecida como a Era dos Descobrimentos.</p><p>Ao caminhar por Belém, você perceberá que o rio continua sendo o grande protagonista da paisagem. Foi por essas águas que partiram navios carregando sonhos, riquezas e incertezas rumo ao desconhecido.</p>", "route": "<h4>Mosteiro dos Jerónimos</h4><p>Poucos monumentos representam tão bem o auge do poder português quanto o Mosteiro dos Jerónimos.</p><p>Sua construção começou em 1501, durante o reinado de D. Manuel I, poucos anos após o retorno de Vasco da Gama da primeira viagem marítima à Índia. Financiado, em grande parte, pelos impostos sobre o lucrativo comércio das especiarias, o mosteiro tornou-se um símbolo da prosperidade alcançada por Portugal durante a Era dos Descobrimentos.</p><p>Antes de entrar, observe cuidadosamente a fachada. O estilo manuelino mistura elementos góticos com motivos marítimos. Cordas esculpidas em pedra, esferas armilares, cruzes da Ordem de Cristo e plantas exóticas lembram constantemente a ligação do país com o mar.</p><p>No interior encontram-se os túmulos de duas das maiores personalidades portuguesas: Vasco da Gama e Luís de Camões. Mais do que um mosteiro, este edifício funciona como um verdadeiro monumento à identidade nacional portuguesa.</p><p>Se tiver tempo, caminhe pelos claustros. A delicadeza das colunas e a riqueza dos detalhes fazem deste um dos conjuntos arquitetônicos mais impressionantes da Europa.</p><h4>Pastéis de Belém</h4><p>Há sabores que também fazem parte da história de um país.</p><p>Os famosos Pastéis de Belém começaram a ser produzidos no século XIX por monges ligados ao Mosteiro dos Jerónimos. Após a extinção das ordens religiosas em Portugal, a receita foi vendida a uma pequena confeitaria instalada nas proximidades. Desde 1837, ela continua sendo preparada praticamente da mesma forma e permanece um dos segredos gastronômicos mais bem guardados do país.</p><p>Observe que apenas aqui o doce recebe oficialmente o nome de &quot;Pastel de Belém&quot;. Em qualquer outro lugar de Portugal ele será chamado de pastel de nata.</p><p>Experimente-o ainda morno, polvilhado com canela e açúcar, como fazem os portugueses. É uma pausa saborosa antes de continuar a viagem pela história.</p><h4>Padrão dos Descobrimentos</h4><p>Este monumento não homenageia apenas navegadores. Ele celebra toda uma geração que levou Portugal muito além de suas fronteiras.</p><p>Construído originalmente em 1940 e reconstruído em pedra em 1960, durante as comemorações dos quinhentos anos da morte do Infante D. Henrique, o monumento tem a forma estilizada da proa de uma caravela avançando sobre o Tejo.</p><p>Observe as figuras esculpidas em ambos os lados. À frente está o Infante D. Henrique, seguido por navegadores, cartógrafos, missionários, cientistas, artistas e outras personalidades que participaram da expansão marítima portuguesa. Cada personagem ocupa ali um lugar cuidadosamente pensado.</p><p>Antes de seguir, olhe para o chão em frente ao monumento. O grande mapa-múndi em pedra, oferecido pela África do Sul, mostra as principais rotas das navegações portuguesas e os anos em que cada território foi alcançado. Vale a pena dedicar alguns minutos para percorrer esse mapa.</p><h4>Torre de Belém</h4><p>Poucos monumentos são tão associados à imagem de Lisboa quanto a Torre de Belém.</p><p>Construída entre 1514 e 1520 para defender a entrada do porto, a torre fazia parte do sistema de proteção da cidade e controlava o intenso movimento de embarcações que navegavam pelo Tejo.</p><p>Observe os detalhes da decoração manuelina. Escudos, cordas esculpidas, cruzes da Ordem de Cristo e pequenas guaritas ornamentadas demonstram como, naquela época, arquitetura militar e arte caminhavam lado a lado.</p><p>Repare também na curiosa escultura de um rinoceronte próxima a uma das torres. Ela faz referência ao primeiro rinoceronte vivo que chegou à Europa moderna, presente enviado ao rei D. Manuel I em 1515. O animal despertou enorme fascínio e acabou eternizado na decoração da fortaleza.</p><p>Da margem do rio, a Torre de Belém revela um dos cenários mais fotografados de Portugal.</p><h4>MAAT (opcional)</h4><p>Depois de mergulhar na história dos Descobrimentos, Belém apresenta outro rosto de Lisboa.</p><p>O Museu de Arte, Arquitetura e Tecnologia, conhecido como MAAT, simboliza uma cidade voltada para o futuro. Seu edifício de linhas curvas parece surgir naturalmente da margem do Tejo, criando uma das arquiteturas contemporâneas mais marcantes de Portugal.</p><p>Se decidir visitá-lo, aproveite para caminhar sobre sua cobertura. Além das exposições temporárias, o terraço oferece uma bela vista do rio, da Ponte 25 de Abril e do casario de Belém.</p><p>O contraste entre o MAAT e os monumentos históricos mostra como Lisboa consegue preservar seu passado enquanto continua reinventando sua paisagem urbana.</p><h4>Caminhada pela margem do Tejo</h4><p>Antes de encerrar o dia, caminhe sem pressa pela margem do Tejo.</p><p>Hoje o rio parece tranquilo, mas durante séculos foi daqui que partiram navios rumo a continentes desconhecidos. Imagine o movimento de marinheiros, comerciantes, soldados e famílias despedindo-se daqueles que talvez nunca voltassem.</p><p>Observe como os monumentos visitados ao longo do dia parecem conversar entre si. O Mosteiro dos Jerónimos celebra a fé e a prosperidade; o Padrão dos Descobrimentos homenageia os protagonistas das navegações; a Torre de Belém lembra a defesa da cidade; e o Tejo conecta todos eles.</p><p>Ao final deste passeio, talvez fique mais fácil compreender por que Belém não representa apenas um bairro de Lisboa. Representa o momento em que um pequeno país, voltado para o Atlântico, expandiu seus horizontes e deixou uma marca permanente na história do mundo.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Próximo ao Mosteiro dos Jerónimos.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> À Margem • Enoteca de Belém • O Frade.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Pastéis de Belém (parada obrigatória).</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Regresso ao centro: Time Out Market ou Chiado.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Belém+Portugal"}, "4": {"label": "D4", "title": "Parque das Nações", "region": "Lisboa", "map": "mapa_d04.png", "opening": "", "route": "<h4>A Lisboa moderna à beira do Tejo</h4><p>Durante séculos, Lisboa cresceu voltada para sua história. No final do século XX, voltou-se para o futuro.</p><p>Até a década de 1990, esta região era ocupada por antigos armazéns, refinarias e áreas industriais degradadas. Em preparação para a Expo 98, a Exposição Mundial que celebrou os oceanos e os 500 anos da viagem de Vasco da Gama à Índia, toda essa área foi completamente transformada.</p><p>Nasceu então o Parque das Nações: um bairro planejado, moderno e sustentável, onde arquitetura contemporânea, espaços públicos, ciência e lazer convivem às margens do Tejo.</p><p>Hoje você conhecerá uma Lisboa diferente daquela vista nos últimos dias. Uma cidade que preserva seu passado, mas continua se reinventando.</p><h4>Oceanário de Lisboa</h4><p>O Oceanário de Lisboa é muito mais do que um aquário. É um convite para compreender a importância dos oceanos para o planeta.</p><p>Inaugurado durante a Expo 98, tornou-se um dos maiores oceanários da Europa e um dos principais símbolos do Parque das Nações. Seu enorme tanque central reúne espécies provenientes dos oceanos Atlântico, Pacífico, Índico e Antártico, demonstrando como todos os mares do planeta estão interligados.</p><p>Ao entrar, caminhe lentamente ao redor do grande tanque. Observe como tubarões, raias, atuns e cardumes convivem em um mesmo ambiente. Em diferentes níveis da visita, a perspectiva muda completamente, revelando novos detalhes a cada andar.</p><p>Reserve alguns minutos para simplesmente observar. Mais do que impressionar pela diversidade de espécies, o Oceanário procura despertar uma reflexão sobre a conservação dos oceanos, tema que continua sendo essencial para um país cuja história sempre esteve ligada ao mar.</p><h4>Teleférico da Nação</h4><p>Poucos passeios oferecem uma visão tão agradável do Parque das Nações quanto o teleférico.</p><p>Durante o trajeto, o Tejo permanece como protagonista. De um lado, aparecem os jardins, os edifícios contemporâneos e a marina; do outro, destaca-se a Ponte Vasco da Gama, uma das maiores pontes da Europa, com mais de 17 quilômetros de extensão.</p><p>À medida que a cabine avança, observe como a arquitetura procura integrar-se aos espaços verdes e à margem do rio. Diferentemente da Lisboa histórica, aqui predominam linhas modernas, grandes áreas abertas e edifícios concebidos para valorizar a luz natural.</p><p>É um excelente momento para perceber como Lisboa conseguiu transformar uma antiga zona industrial em um dos bairros mais agradáveis da cidade.</p><h4>Pavilhão do Conhecimento</h4><p>A ciência também pode ser divertida.</p><p>O Pavilhão do Conhecimento foi criado para despertar a curiosidade de visitantes de todas as idades por meio de experiências interativas. Aqui, o objetivo não é apenas observar, mas participar.</p><p>Ao percorrer as exposições, experimente os equipamentos, teste os desafios e explore os experimentos. Muitos deles demonstram fenômenos físicos presentes no cotidiano de maneira simples e intuitiva.</p><p>Mesmo para quem viaja sem crianças, a visita costuma surpreender. O espaço mostra como ciência, tecnologia e criatividade podem transformar conhecimento em experiência.</p><h4>Passeio pela margem do Tejo</h4><p>Depois das visitas, caminhe sem pressa pela margem do rio.</p><p>O Tejo continua sendo o mesmo rio que acompanhou toda a história de Lisboa, mas a paisagem ao redor mudou completamente. No lugar de fortalezas, mosteiros e antigos cais, surgem parques, ciclovias, jardins e edifícios de arquitetura contemporânea.</p><p>Observe também a Ponte Vasco da Gama. Com seus mais de 17 quilômetros de extensão, ela foi construída para melhorar a mobilidade da região metropolitana e tornou-se um dos marcos da engenharia portuguesa.</p><p>Este é um ótimo momento para fazer uma pausa e simplesmente apreciar a tranquilidade do lugar.</p><h4>Pavilhão de Portugal</h4><p>Poucos edifícios representam tão bem a arquitetura portuguesa contemporânea quanto o Pavilhão de Portugal.</p><p>Projetado pelo arquiteto Álvaro Siza Vieira, vencedor do Prêmio Pritzker, o edifício tornou-se um dos maiores ícones da Expo 98. Seu elemento mais impressionante é a enorme cobertura de concreto que parece flutuar entre dois pilares.</p><p>Afaste-se alguns metros para observar essa cobertura. Ela possui apenas cerca de vinte centímetros de espessura no ponto central, um feito notável da engenharia estrutural.</p><p>O edifício demonstra como simplicidade, elegância e inovação podem caminhar juntas, tornando-se um dos símbolos da arquitetura portuguesa do século XXI.</p><h4>Almoço na Doca dos Olivais</h4><p>Depois de uma manhã de descobertas, aproveite para almoçar com calma à beira do Tejo.</p><p>A Doca dos Olivais reúne restaurantes, cafés e esplanadas voltados para a marina. Diferentemente das áreas históricas da cidade, aqui o ambiente é mais tranquilo e contemporâneo.</p><p>Enquanto almoça, observe o movimento das embarcações e a convivência entre moradores, turistas e esportistas. É um excelente lugar para desacelerar antes de continuar o passeio.</p><h4>Gare do Oriente (opcional)</h4><p>Mesmo que você não pretenda embarcar em um trem, vale a pena visitar a Gare do Oriente.</p><p>Projetada pelo arquiteto espanhol Santiago Calatrava, a estação tornou-se uma das obras arquitetônicas mais conhecidas de Lisboa. Sua cobertura metálica lembra uma floresta de árvores estilizadas e permite a entrada abundante de luz natural.</p><p>Observe como estrutura e estética se unem de maneira elegante. O edifício funciona simultaneamente como estação ferroviária, terminal rodoviário e estação de metrô, tornando-se um importante centro de mobilidade da cidade.</p><p>Ao lado está o Shopping Vasco da Gama, uma boa opção para compras, um café ou simplesmente encerrar o dia antes de retornar ao hotel.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Hotel ou Estação Oriente.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Doca dos Olivais: Honest Greens • Portugália • Honorato.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Shopping Vasco da Gama.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Parque das Nações ou retorno ao hotel.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Parque+das+Nações+Portugal"}, "5": {"label": "D5", "title": "Lisboa sem pressa", "region": "Lisboa", "map": "mapa_d05.png", "opening": "<p class=\"day-subtitle\">A cidade além dos cartões-postais</p><p>Durante os últimos dias você conheceu a história de Lisboa. Caminhou por suas ruas medievais, descobriu como a cidade renasceu após o terremoto de 1755, acompanhou o início das Grandes Navegações e viu como a capital portuguesa continua se reinventando.</p><p>Hoje não há uma lista de monumentos imperdíveis.</p><p>O convite é outro: caminhar sem pressa, entrar em uma livraria, sentar em um café, descobrir uma pequena loja, observar o movimento das pessoas e experimentar Lisboa como fazem os lisboetas.</p><p>Grandes cidades não são feitas apenas de monumentos. São feitas dos lugares onde seus moradores vivem, trabalham, conversam e passam o tempo. É essa Lisboa cotidiana que você conhecerá hoje.</p>", "route": "<h4>LX Factory</h4><p>Poucos lugares representam tão bem a capacidade de Lisboa de se reinventar quanto a LX Factory.</p><p>O complexo ocupa antigas instalações industriais que permaneceram abandonadas durante décadas. Em vez de demolir os edifícios, a cidade transformou o espaço em um centro dedicado à criatividade, reunindo livrarias, galerias de arte, ateliês, restaurantes, cafés e pequenas lojas de design.</p><p>Caminhe sem pressa. Observe como antigas estruturas de tijolos, vigas metálicas e paredes industriais convivem com murais de arte urbana e intervenções contemporâneas. Cada edifício parece contar duas histórias ao mesmo tempo: a da Lisboa industrial e a da Lisboa criativa.</p><p>Não deixe de visitar a Livraria Ler Devagar. Mesmo para quem não pretende comprar livros, o espaço impressiona pela arquitetura, pelas estantes que ocupam vários andares e pela enorme bicicleta suspensa sobre o salão principal.</p><p>Mais do que um ponto turístico, a LX Factory é um lugar onde os próprios lisboetas gostam de passar o tempo.</p><h4>Chiado</h4><p>Poucos bairros conseguem reunir cultura, literatura, comércio e gastronomia de forma tão harmoniosa quanto o Chiado.</p><p>Desde o século XIX, escritores, artistas e intelectuais transformaram estas ruas em um dos principais centros culturais de Lisboa. Fernando Pessoa, Eça de Queirós e tantos outros caminharam por aqui, frequentando cafés e livrarias que continuam fazendo parte da vida da cidade.</p><p>Enquanto percorre o bairro, observe as elegantes fachadas, os bondes amarelos cruzando as ruas e o movimento constante das pessoas. Entre uma loja e outra, descubra pequenas livrarias, papelarias tradicionais e cafés históricos.</p><p>Se passar pela Brasileira, procure a famosa estátua de Fernando Pessoa sentada à mesa. É um dos locais mais fotografados do bairro e um convite para imaginar o escritor observando o movimento da cidade enquanto escrevia.</p><p>No Chiado, vale mais desacelerar do que cumprir horários.</p><h4>El Corte Inglés</h4><p>O El Corte Inglés é muito mais do que uma loja de departamentos. É um dos principais centros comerciais da Península Ibérica e um ótimo lugar para conhecer marcas portuguesas e internacionais reunidas em um único espaço.</p><p>Se pretende comprar vinhos, azeites, chocolates, conservas ou lembranças de qualidade, reserve algum tempo para visitar o supermercado gourmet localizado no piso inferior. Muitos produtos portugueses podem ser encontrados ali por preços bastante competitivos.</p><p>Mesmo que não esteja fazendo compras, vale a pena conhecer o edifício e observar como ele faz parte da rotina dos moradores de Lisboa.</p><h4>Primark</h4><p>A Primark tornou-se uma parada tradicional para muitos visitantes que procuram moda acessível.</p><p>A variedade de roupas, acessórios e artigos para casa costuma atrair turistas de toda a Europa. Se decidir entrar, faça isso sem pressa e esteja preparado para encontrar bastante movimento, principalmente nos fins de semana.</p><p>É uma boa oportunidade para pequenas compras antes de continuar a viagem.</p><h4>Almoço na zona ribeirinha</h4><p>Depois de uma manhã tranquila, aproveite para almoçar próximo ao Tejo.</p><p>A região da Doca dos Olivais e seus arredores reúne restaurantes para todos os estilos, desde cozinhas tradicionais portuguesas até opções internacionais. Mais do que escolher um restaurante específico, a ideia é aproveitar o ambiente.</p><p>Se possível, escolha uma mesa ao ar livre. Observe o movimento das pessoas, das bicicletas, das embarcações e deixe que a cidade siga seu ritmo. Nem toda lembrança de viagem nasce diante de um monumento.</p><h4>Avenida da Liberdade</h4><p>Você já passou por aqui no primeiro dia da viagem. Hoje o convite é diferente.</p><p>Em vez de apenas atravessar a avenida, caminhe por seus jardins centrais. Observe os bancos, as fontes, as esculturas e o movimento tranquilo de quem utiliza esse espaço para passear, descansar ou simplesmente conversar.</p><p>As vitrines das grandes marcas internacionais dividem espaço com cafés elegantes e edifícios históricos. Mesmo sem fazer compras, vale a pena apreciar a atmosfera da avenida.</p><p>Talvez você perceba que Lisboa revela uma personalidade diferente quando deixamos de procurar atrações e passamos simplesmente a caminhar.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> LX Factory: Wish Slow Coffee ou Ler Devagar Café.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Time Out Market • Sea Me • Nicolau Chiado.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> A Brasileira • Confeitaria Nacional • Manteigaria.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> JNcQUOI Avenida • Solar dos Presuntos • Ribadouro.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Lisboa+sem+pressa+Portugal"}, "6": {"label": "D6", "title": "Lisboa Extra", "region": "Lisboa", "map": "mapa_d06.png", "opening": "<p>Depois de caminhar pelas ruas medievais de Alfama, compreender a reconstrução da Baixa, reviver a Era dos Descobrimentos em Belém e descobrir a Lisboa contemporânea no Parque das Nações, talvez você perceba que ainda há muito por conhecer.</p><p>E essa é justamente uma das maiores qualidades de Lisboa.</p><p>Ela nunca termina.</p><p>Hoje não existe um roteiro obrigatório. Não há horários nem uma sequência definida de atrações. A proposta é simples: escolher aquilo que mais combina com o seu momento.</p><p>Talvez você queira aprofundar a história da cidade, visitar um museu, caminhar por um jardim, fazer compras, atravessar o Tejo ou simplesmente sentar em um café e observar a vida passar.</p><p>Lisboa recompensa quem desacelera.</p>", "route": "<h4>Convento do Carmo</h4><p>Poucos lugares conseguem contar um capítulo inteiro da história de Lisboa sem precisar dizer uma única palavra.</p><p>As ruínas do Convento do Carmo permanecem abertas para o céu desde o terremoto de 1755. Diferentemente de muitos edifícios da cidade, nunca foram totalmente reconstruídas. Permanecem como um memorial permanente daquela tragédia que transformou Lisboa para sempre.</p><p>Ao caminhar entre os antigos arcos góticos, imagine a dimensão do edifício antes do terremoto. Era uma das maiores igrejas da cidade.</p><p>Hoje, as paredes preservadas convivem com o céu aberto, criando um dos cenários mais marcantes de Lisboa. O espaço abriga também um pequeno museu arqueológico, onde diferentes períodos da história portuguesa podem ser observados em um único lugar.</p><p>É uma visita silenciosa, que convida mais à contemplação do que à fotografia.</p><h4>Elevador de Santa Justa</h4><p>Embora tenha sido construído como um meio de transporte urbano, o Elevador de Santa Justa tornou-se um dos cartões-postais mais conhecidos de Lisboa.</p><p>Projetado pelo engenheiro Raoul Mesnier du Ponsard, discípulo de Gustave Eiffel, foi inaugurado em 1902 para ligar a Baixa ao Bairro Alto, vencendo o grande desnível existente entre os dois bairros.</p><p>Mesmo que você não utilize o elevador, vale a pena observar sua estrutura metálica, típica da arquitetura industrial do início do século XX.</p><p>No topo encontra-se um dos miradouros mais conhecidos da cidade. Dali é possível contemplar a Baixa Pombalina, o Castelo de São Jorge, o Tejo e boa parte do centro histórico.</p><p>Se possível, visite-o logo pela manhã ou no final da tarde, quando há menos filas.</p><h4>Jardim da Estrela</h4><p>Nem toda beleza de Lisboa está em seus monumentos.</p><p>O Jardim da Estrela oferece uma pausa tranquila em meio à cidade. Inaugurado no século XIX, combina lagos, caminhos arborizados, esculturas, jardins cuidadosamente planejados e árvores centenárias.</p><p>É um daqueles lugares frequentados principalmente pelos moradores da cidade. Crianças brincam, idosos conversam, estudantes leem, casais caminham e turistas descobrem um lado mais cotidiano de Lisboa.</p><p>Se tiver tempo, sente-se em um banco por alguns minutos. Algumas das melhores lembranças de viagem surgem justamente nesses momentos sem pressa.</p><h4>Parque Eduardo VII</h4><p>Do alto do Parque Eduardo VII encontra-se uma das vistas mais amplas de Lisboa.</p><p>À frente estende-se toda a Avenida da Liberdade, conduzindo naturalmente o olhar até a Baixa e o Tejo.</p><p>Projetado como um grande jardim urbano, o parque combina extensos gramados, esculturas, áreas de lazer e caminhos agradáveis para caminhar.</p><p>É também um excelente local para compreender a expansão da cidade além do centro histórico.</p><p>Se o dia estiver claro, reserve alguns minutos apenas para apreciar a paisagem.</p><h4>Avenida da Liberdade</h4><p>Se nos primeiros dias ela marcou o início do seu roteiro, hoje a Avenida da Liberdade pode ser apreciada de outra maneira.</p><p>Talvez seja hora de entrar em uma das livrarias, descobrir uma confeitaria tradicional ou simplesmente caminhar pelos jardins centrais observando o movimento da cidade.</p><p>Mais do que um endereço de lojas de luxo, a avenida funciona como um elegante boulevard onde moradores e visitantes compartilham o mesmo espaço.</p><p>Às vezes, o melhor programa é justamente não ter programa algum.</p><h4>El Corte Inglés</h4><p>Muito além das compras, o El Corte Inglés reúne gastronomia, livraria, delicatessen e uma excelente seleção de produtos portugueses.</p><p>É um bom lugar para adquirir presentes de última hora, experimentar vinhos, azeites, doces tradicionais ou simplesmente fazer uma pausa em um café.</p><p>Se pretende levar sabores de Portugal para casa, este costuma ser um dos melhores lugares para isso.</p><h4>Mercado de Campo de Ourique</h4><p>Enquanto o Time Out Market tornou-se um sucesso entre os turistas, o Mercado de Campo de Ourique preserva um ambiente muito mais frequentado pelos lisboetas.</p><p>Ali convivem bancas tradicionais, pequenos restaurantes, cafés e lojas especializadas em produtos portugueses.</p><p>É um excelente lugar para um almoço tranquilo ou para experimentar diferentes sabores sem a agitação dos grandes centros turísticos.</p><p>Observe o movimento das pessoas. Poucos lugares mostram tão bem a rotina da cidade.</p><h4>Cafés sem pressa</h4><p>Lisboa possui uma longa tradição de cafés históricos.</p><p>Escolha um que lhe pareça convidativo. Peça um café, um pastel de nata ou um doce tradicional e simplesmente permaneça ali por algum tempo.</p><p>Viajar também é aprender a desacelerar.</p><p>Algumas cidades impressionam pelos monumentos. Lisboa conquista justamente nos intervalos entre eles.</p><h4>Cristo Rei</h4><p>Na margem sul do Tejo encontra-se um dos melhores miradouros de toda a região metropolitana.</p><p>Inspirado no Cristo Redentor do Rio de Janeiro, o Cristo Rei foi inaugurado em 1959 como agradecimento por Portugal não ter participado diretamente da Segunda Guerra Mundial.</p><p>Do alto da plataforma de observação, Lisboa revela uma perspectiva completamente diferente. O Tejo, a Ponte 25 de Abril, o centro histórico e grande parte da cidade podem ser vistos em um único panorama.</p><p>É um excelente lugar para compreender a relação permanente entre Lisboa e o rio.</p><h4>Cacilhas</h4><p>Durante muito tempo, Cacilhas foi apenas um ponto de chegada para quem atravessava o Tejo de barco.</p><p>Hoje tornou-se um agradável bairro à beira-rio, conhecido por seus restaurantes especializados em peixes e frutos do mar.</p><p>Caminhar pelo cais oferece uma das melhores vistas do horizonte de Lisboa, especialmente ao entardecer, quando o sol ilumina a cidade do outro lado do rio.</p><p>É um passeio simples, mas muito autêntico.</p><h4>Boca do Vento</h4><p>Poucos visitantes chegam até este miradouro, e talvez justamente por isso ele seja tão especial.</p><p>Um elevador liga a parte baixa de Cacilhas ao Jardim do Rio, onde a vista para Lisboa é ampla e pouco conhecida pelos turistas.</p><p>Daqui, percebe-se como a cidade se desenvolveu acompanhando a margem norte do Tejo, enquanto a Ponte 25 de Abril parece unir duas paisagens completamente distintas.</p><p>É um excelente lugar para terminar o dia.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Escolha conforme a região visitada.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Mercado de Campo de Ourique ou Cacilhas (peixes e mariscos).</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Café no Príncipe Real ou Jardim da Estrela.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Restaurante que mais tenha agradado durante a estadia em Lisboa.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Lisboa+Extra+Portugal"}, "7": {"label": "D7", "title": "Sintra", "region": "Sintra", "map": "mapa_d07.png", "opening": "", "route": "<h4>A vila romântica</h4><p>Ao deixar Lisboa para trás, a paisagem começa lentamente a mudar. O Tejo desaparece, as colinas tornam-se mais verdes e o ar fica mais fresco. Poucos quilômetros separam as duas cidades, mas a sensação é de estar entrando em outro mundo.</p><p>Durante séculos, reis, nobres, artistas e escritores encontraram em Sintra um refúgio para escapar do calor de Lisboa. O clima ameno, a vegetação exuberante e a Serra de Sintra criaram um cenário que inspirou palácios extravagantes, jardins misteriosos e histórias que misturam realidade e lenda.</p><p>Em 1995, a UNESCO reconheceu Sintra como Patrimônio Mundial da Humanidade, classificando-a como a primeira Paisagem Cultural inscrita nessa categoria. Aqui, natureza e arquitetura formam um conjunto inseparável.</p><p>Hoje não será um dia para correr de uma atração à outra. Será um dia para caminhar lentamente, observar detalhes e deixar-se surpreender por uma das cidades mais encantadoras de Portugal.</p><h4>Centro Histórico de Sintra</h4><p>Poucas vilas europeias conseguem preservar uma atmosfera tão característica quanto o centro histórico de Sintra.</p><p>As ruas estreitas, as casas caiadas de branco, os telhados de cerâmica e as pequenas lojas criam um ambiente que parece ter permanecido praticamente inalterado durante séculos. Ao caminhar, observe como cada rua revela uma nova perspectiva da serra ou dos palácios que despontam entre as árvores.</p><p>No alto da vila destaca-se o Palácio Nacional de Sintra, facilmente reconhecido pelas duas grandes chaminés cônicas de sua cozinha medieval. Durante vários séculos foi residência oficial da família real portuguesa e acompanhou praticamente toda a história do reino.</p><p>Não tenha pressa. Entre em pequenas lojas, observe os detalhes das fachadas e permita-se simplesmente caminhar. Em Sintra, perder-se um pouco faz parte da experiência.</p><h4>Piriquita</h4><p>Algumas tradições sobrevivem por gerações.</p><p>Fundada em 1862, a Casa Piriquita tornou-se uma das confeitarias mais tradicionais de Portugal e é o berço do famoso Travesseiro de Sintra.</p><p>O doce combina massa folhada extremamente leve com um recheio delicado de creme de amêndoas, servido ainda morno durante boa parte do dia. A receita permanece praticamente inalterada há mais de um século.</p><p>Além dos travesseiros, experimente também as queijadas de Sintra, cuja origem remonta à Idade Média.</p><p>Pode haver fila, principalmente na alta temporada, mas ela costuma andar rapidamente e faz parte da tradição da visita.</p><h4>Almoço na vila</h4><p>O centro histórico oferece excelentes opções para almoço.</p><p>Escolha um restaurante nas ruas próximas ao Palácio Nacional ou em uma das pequenas travessas da vila. A gastronomia local valoriza ingredientes simples e receitas tradicionais portuguesas.</p><p>Se possível, escolha uma mesa ao ar livre. Enquanto almoça, observe o movimento de turistas e moradores circulando pelas ruas estreitas. Em poucas cidades o cenário é tão agradável quanto em Sintra.</p><p>É um bom momento para descansar antes da principal visita da tarde.</p><h4>Quinta da Regaleira</h4><p>Se existe um lugar capaz de resumir o espírito de Sintra, esse lugar é a Quinta da Regaleira.</p><p>Construída no início do século XX pelo milionário António Augusto Carvalho Monteiro, a propriedade foi concebida como uma verdadeira obra de arte repleta de símbolos ligados à alquimia, à maçonaria, aos Templários e às antigas tradições esotéricas.</p><p>Nada aqui parece ter sido construído por acaso.</p><p>Ao caminhar pelos jardins, observe como grutas, lagos, passagens subterrâneas, torres e pequenos templos surgem inesperadamente entre a vegetação, criando uma sensação constante de descoberta.</p><p>O grande destaque da visita é o famoso Poço Iniciático. Apesar da aparência, ele nunca foi utilizado para captação de água. Trata-se de uma construção simbólica composta por uma escadaria em espiral que desce vários metros até uma galeria subterrânea.</p><p>Ao descer lentamente seus degraus, observe a geometria da escadaria, os símbolos gravados na pedra e a iluminação natural que entra pelo alto do poço. Muitos estudiosos relacionam o percurso à ideia de morte simbólica e renascimento espiritual, comum em antigos rituais iniciáticos.</p><p>Depois de explorar o poço, siga pelos túneis subterrâneos que conduzem a grutas, lagos e diferentes pontos do jardim. Essa sequência faz parte da experiência e reforça a sensação de estar percorrendo um cenário criado para despertar a imaginação.</p><p>Mais do que um palácio ou um jardim, a Quinta da Regaleira é uma experiência.</p><h4>Jantar em Sintra</h4><p>Ao cair da noite, o centro histórico ganha uma atmosfera completamente diferente.</p><p>As excursões já partiram, as ruas tornam-se mais silenciosas e a iluminação valoriza a arquitetura histórica da vila.</p><p>Escolha um restaurante sem pressa. Experimente pratos tradicionais portugueses acompanhados por um vinho da região ou simplesmente aproveite o ambiente.</p><p>Se ainda tiver disposição, faça uma última caminhada pelas ruas próximas ao Palácio Nacional. Poucas experiências encerram tão bem o primeiro dia em Sintra.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Airbnb ou Café Saudade. Se preferir começar pelo doce típico, Casa Piriquita.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Tascantiga • Apeadeiro • Bacalhau na Vila.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Casa Piriquita – Travesseiros e Queijadas.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Romaria de Baco • Incomum by Luís Santos • Tulhas Bar &amp; Restaurante.</p><p class=\"food-line\"><strong>Dica:</strong> todas as opções ficam no Centro Histórico ou muito próximas da Quinta da Regaleira.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Sintra+Portugal"}, "8": {"label": "D8", "title": "Sintra", "region": "Sintra", "map": "mapa_d08.png", "opening": "<p class=\"day-subtitle\">Da serra ao Atlântico</p><p>Se o dia anterior revelou o encanto da vila histórica, hoje você conhecerá a paisagem que fez de Sintra um lugar único no mundo.</p><p>Ao longo dos séculos, reis portugueses escolheram estas montanhas como refúgio de verão. A combinação entre o clima fresco, a vegetação exuberante e as vistas sobre o oceano transformou a Serra de Sintra em um cenário perfeito para a construção de palácios, jardins e fortalezas.</p><p>O roteiro de hoje acompanha essa transição. Começa no ponto mais alto da serra, atravessa séculos de história e termina diante do Atlântico, no extremo ocidental da Europa Continental.</p><p>Prepare-se para um dos dias mais bonitos de toda a viagem.</p>", "route": "<h4>Palácio da Pena</h4><p>Poucos edifícios são tão facilmente reconhecidos quanto o Palácio da Pena.</p><p>Erguido no século XIX sobre as ruínas de um antigo mosteiro, ele tornou-se o maior símbolo do Romantismo português. O rei D. Fernando II idealizou um palácio que misturasse diferentes estilos arquitetônicos — gótico, manuelino, mourisco e renascentista — criando uma construção quase fantástica.</p><p>À primeira vista, as cores chamam imediatamente a atenção. O amarelo e o vermelho não foram escolhidos ao acaso. Eles ajudam a destacar os diferentes volumes do edifício e reforçam o caráter lúdico da arquitetura.</p><p>Enquanto percorre os terraços, observe como o palácio parece surgir naturalmente entre as árvores da serra. Em muitos pontos, a paisagem torna-se tão impressionante quanto a própria construção.</p><p>Se o céu estiver limpo, é possível avistar Lisboa, o Tejo e o Atlântico ao longe. Poucos miradouros oferecem uma vista tão ampla sobre a região.</p><p>Reserve tempo também para caminhar pelos jardins do Parque da Pena. Lagos, trilhas, árvores centenárias e espécies trazidas de diferentes partes do mundo completam a experiência.</p><h4>Castelo dos Mouros</h4><p>Muito antes da construção dos palácios, esta era a fortaleza que protegia Sintra.</p><p>O Castelo dos Mouros foi erguido entre os séculos VIII e IX, durante o domínio islâmico da Península Ibérica. Sua principal função era controlar os acessos à serra e vigiar toda a região até o oceano.</p><p>Após a conquista cristã de Sintra, em 1147, o castelo continuou desempenhando papel estratégico durante algum tempo, mas acabou perdendo importância com o passar dos séculos.</p><p>Hoje, seu maior atrativo está na caminhada pelas muralhas.</p><p>Enquanto percorre o caminho, imagine os antigos sentinelas observando a chegada de embarcações pelo Atlântico ou monitorando qualquer movimentação na planície abaixo.</p><p>As vistas panorâmicas são espetaculares. De um lado está o Palácio da Pena; do outro, a vila de Sintra; ao fundo, o oceano completa a paisagem.</p><p>É um dos melhores lugares para compreender a geografia da região.</p><h4>Centro Histórico de Sintra</h4><p>Depois da manhã na serra, retornar ao centro histórico oferece uma perspectiva completamente diferente.</p><p>Agora você observa a vila de baixo, cercada pelas montanhas que acabara de visitar.</p><p>Aproveite para caminhar novamente por suas ruas, descobrir alguma loja que tenha passado despercebida no dia anterior ou simplesmente sentar em um café.</p><p>Sintra é uma cidade que recompensa quem retorna aos mesmos lugares.</p><p>Cada caminhada revela novos detalhes.</p><h4>Palácio de Monserrate</h4><p>Se o Palácio da Pena representa o romantismo exuberante, Monserrate revela seu lado mais elegante.</p><p>Construído no século XIX, o palácio combina influências mouriscas, indianas e góticas de maneira surpreendentemente harmoniosa.</p><p>Observe a delicadeza das colunas, dos arcos e das cúpulas ornamentadas. A decoração parece extremamente rica, mas ao mesmo tempo leve.</p><p>Os jardins merecem tanta atenção quanto o edifício principal.</p><p>Espécies vegetais vindas da Ásia, África, América e Oceania foram cuidadosamente distribuídas ao longo dos caminhos, criando diferentes paisagens ao redor do palácio.</p><p>É um dos lugares mais tranquilos de Sintra e costuma receber menos visitantes do que o Palácio da Pena, permitindo uma visita mais contemplativa.</p><h4>Cabo da Roca</h4><p>De repente, a terra termina.</p><p>O Cabo da Roca marca o ponto mais ocidental da Europa Continental. Durante séculos, para muitos navegadores portugueses, este era literalmente o fim do mundo conhecido.</p><p>O poeta Luís de Camões descreveu este lugar como &quot;onde a terra se acaba e o mar começa&quot;, frase que se tornou inseparável da história do cabo.</p><p>Ao chegar, aproxime-se dos miradouros com calma.</p><p>Os penhascos despencam mais de cem metros até o Atlântico, enquanto o farol continua orientando embarcações desde o século XVIII.</p><p>O vento costuma ser forte durante todo o ano. Mesmo em dias quentes, vale a pena levar um agasalho leve.</p><p>Reserve alguns minutos apenas para observar o horizonte. Poucos lugares transmitem tão claramente a sensação de imensidão quanto este.</p><h4>Azenhas do Mar</h4><p>Se existe uma imagem capaz de resumir o litoral português, provavelmente ela se parece com Azenhas do Mar.</p><p>As casas brancas parecem brotar diretamente das falésias, descendo em direção ao oceano até alcançar uma pequena piscina natural formada pelas rochas.</p><p>Originalmente uma aldeia de pescadores, Azenhas do Mar preserva até hoje um ambiente tranquilo e um dos cenários mais fotografados de Portugal.</p><p>Caminhe até os miradouros antes de descer em direção ao mar. A vista panorâmica revela toda a harmonia entre as construções, as falésias e o Atlântico.</p><p>Se o horário permitir, permaneça até o pôr do sol.</p><p>A luz dourada refletindo sobre as casas brancas cria um espetáculo inesquecível e encerra de maneira perfeita a jornada por Sintra.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> Airbnb ou café próximo à Estação de Sintra.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Centro Histórico – Tascantiga • Cantinho Gourmet • Nau Palatina.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Azenhas do Mar – café ou esplanada com vista para o Atlântico.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Azenhas do Mar Restaurante • Adega das Azenhas ou retorno ao Centro Histórico de Sintra.</p><p class=\"food-line\"><strong>Dica:</strong> o almoço é antes de retirar o carro; o café da tarde combina perfeitamente com a parada em Azenhas do Mar.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Sintra+Portugal"}, "9": {"label": "D9", "title": "Nazaré & Óbidos", "region": "Nazaré & Óbidos", "map": "mapa_d09.png", "opening": "<p class=\"day-subtitle\">Do Atlântico às muralhas medievais</p><p>Depois dos palácios românticos de Sintra, a viagem segue rumo ao litoral português. O verde da serra dá lugar ao azul intenso do Atlântico, onde o mar revela uma força capaz de impressionar até quem já conhece o oceano.</p><p>Pela manhã, você conhecerá Nazaré, uma vila que preserva suas tradições de pesca e que se tornou mundialmente famosa pelas maiores ondas já surfadas pelo homem.</p><p>À tarde, o cenário muda completamente. O mar fica para trás e surgem muralhas, ruas de pedra e casas caiadas de branco. Óbidos parece ter parado no tempo, preservando uma das vilas medievais mais bem conservadas de Portugal.</p><p>Hoje você percorrerá dois mundos completamente diferentes unidos pela mesma costa portuguesa.</p>", "route": "<h4>Miradouro do Sítio</h4><p>A melhor maneira de conhecer Nazaré é começar pelo alto.</p><p>Do Miradouro do Sítio, toda a praia se estende diante dos olhos, revelando a longa faixa de areia, o casario branco e o Atlântico dominando o horizonte.</p><p>Em dias de mar agitado, é fácil perceber por que Nazaré se tornou um dos lugares mais famosos do mundo entre os surfistas.</p><p>As ondas gigantes que quebram nesta região não acontecem por acaso. Elas são formadas pelo Canhão da Nazaré, um enorme vale submarino com mais de duzentos quilômetros de extensão e profundidades que ultrapassam cinco mil metros. Essa formação concentra e amplifica a energia das ondas do oceano, criando algumas das maiores já registradas.</p><p>Mesmo quando o mar está calmo, a paisagem continua impressionante.</p><p>Reserve alguns minutos apenas para observar o oceano. Poucos lugares transmitem tão claramente a força da natureza.</p><h4>Forte de São Miguel Arcanjo</h4><p>Na extremidade da falésia encontra-se o Forte de São Miguel Arcanjo.</p><p>Construído no século XVI para proteger a costa portuguesa contra ataques vindos do mar, ele ganhou uma nova função nos últimos anos: tornou-se um dos principais pontos de observação das famosas ondas gigantes.</p><p>Do terraço é possível enxergar perfeitamente o farol vermelho que aparece em praticamente todas as imagens das grandes competições de surfe.</p><p>No interior funciona um pequeno espaço dedicado à história das ondas da Nazaré e aos atletas que desafiaram seus limites.</p><p>Ao olhar para o oceano, imagine que algumas ondas registradas aqui já ultrapassaram trinta metros de altura, equivalentes a um edifício de dez andares.</p><h4>Praia da Nazaré</h4><p>Depois da vista panorâmica, é hora de descer até a praia.</p><p>Nazaré continua sendo, antes de tudo, uma tradicional vila de pescadores.</p><p>Enquanto caminha pelo calçadão, observe os barcos coloridos, as redes de pesca e, dependendo da época do ano, as tradicionais mulheres nazarenas usando várias saias sobrepostas. Segundo a tradição, as sete saias representam sete virtudes, sete dias da semana ou sete cores do arco-íris. Existem diversas interpretações, todas incorporadas ao imaginário local.</p><p>Mesmo com o crescimento do turismo, a vila preserva uma forte identidade ligada ao mar.</p><p>É um excelente lugar para caminhar sem pressa e observar a rotina da cidade.</p><h4>Almoço em Nazaré</h4><p>Poucos lugares são tão indicados para experimentar frutos do mar quanto Nazaré.</p><p>Os restaurantes da orla oferecem desde pratos tradicionais portugueses até receitas baseadas no pescado do dia.</p><p>Se possível, escolha uma mesa com vista para o mar.</p><p>Enquanto almoça, observe como a praia continua sendo o centro da vida local, reunindo pescadores, moradores, surfistas e visitantes.</p><h4>Chegada a Óbidos</h4><p>Poucos quilômetros separam Nazaré de Óbidos, mas a mudança de cenário é surpreendente.</p><p>Ao atravessar a Porta da Vila, parece que o tempo volta vários séculos.</p><p>Deixe as bagagens no alojamento e aproveite alguns minutos para simplesmente sentir a atmosfera da cidade.</p><p>As ruas estreitas, as casas brancas decoradas com flores e as muralhas de pedra criam um dos conjuntos urbanos medievais mais preservados de Portugal.</p><h4>Porta da Vila</h4><p>A Porta da Vila marca a entrada principal do centro histórico.</p><p>Antes de atravessá-la, observe os belíssimos painéis de azulejos do século XVIII que decoram seu interior. Eles representam cenas religiosas e surpreendem quem espera encontrar apenas uma simples fortificação medieval.</p><p>Durante séculos, todos que chegavam a Óbidos passavam exatamente por este ponto.</p><p>É o início perfeito para descobrir a cidade.</p><h4>Rua Direita</h4><p>A Rua Direita é a principal via do centro histórico desde a Idade Média.</p><p>Hoje abriga pequenas lojas, cafés, livrarias, ateliês e confeitarias instalados em edifícios históricos cuidadosamente preservados.</p><p>Enquanto caminha, observe as fachadas caiadas de branco com faixas azuis e amarelas, as buganvílias cobrindo parte das paredes e as janelas decoradas com flores.</p><p>A atmosfera tranquila faz com que seja difícil imaginar que esta já foi uma importante rota comercial dentro das muralhas.</p><p>É uma rua feita para ser percorrida sem pressa.</p><h4>Castelo e muralhas</h4><p>Poucas experiências são tão marcantes em Óbidos quanto caminhar sobre suas muralhas.</p><p>Grande parte da fortificação foi construída entre os séculos XII e XIV e permanece surpreendentemente preservada.</p><p>Ao longo do percurso, observe como a vila parece encaixar-se perfeitamente dentro do perímetro das muralhas.</p><p>Do alto, é possível contemplar os telhados avermelhados, as igrejas, as ruas estreitas e a paisagem rural que cerca Óbidos.</p><p>Em alguns trechos não existem guarda-corpos, portanto caminhe com atenção.</p><p>Mais do que uma fortificação, as muralhas funcionam como um grande miradouro sobre uma das cidades históricas mais bonitas de Portugal.</p><h4>Ginjinha de Óbidos</h4><p>Antes do jantar, experimente uma das tradições mais conhecidas da cidade.</p><p>A ginjinha é um licor produzido a partir da ginja, uma variedade de cereja bastante aromática.</p><p>Em Óbidos, tornou-se tradição servi-la em pequenos copos feitos de chocolate.</p><p>Primeiro beba o licor lentamente. Depois, coma o copinho.</p><p>É uma pequena experiência gastronômica que já faz parte da identidade da cidade.</p><h4>Jantar em Óbidos</h4><p>À medida que a noite chega, Óbidos torna-se ainda mais charmosa.</p><p>Com a maioria dos visitantes retornando às cidades vizinhas, as ruas ficam silenciosas e a iluminação destaca a arquitetura medieval.</p><p>Escolha um restaurante no centro histórico e aproveite a culinária portuguesa em um ambiente que parece saído de outra época.</p><p>Poucas cidades oferecem um encerramento de dia tão agradável quanto este.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> antes da saída de Sintra ou parada rápida na estrada.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Nazaré – A Tasquinha • Rosa dos Ventos • Taberna d&#x27;Adélia.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Óbidos – café na Rua Direita e Ginjinha de Óbidos.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Petrarum Domus • Jamon Jamon • Vila Infanta.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Nazaré+&+Óbidos+Portugal"}, "10": {"label": "D10", "title": "Fátima & Évora", "region": "Fátima & Évora", "map": "mapa_d10.png", "opening": "<p class=\"day-subtitle\">Fé e História no coração do Alentejo</p><p>Depois da força do Atlântico e do encanto das vilas medievais, a viagem segue para um dos lugares mais visitados do mundo por peregrinos de todas as religiões.</p><p>Independentemente da fé de cada visitante, Fátima impressiona pelo ambiente de silêncio, respeito e contemplação que envolve o Santuário. Milhões de pessoas chegam aqui todos os anos movidas pela esperança, pela gratidão ou simplesmente pelo desejo de conhecer um dos maiores centros de peregrinação do planeta.</p><p>À tarde, o cenário muda mais uma vez. A estrada segue pelo Alentejo até Évora, cidade Patrimônio Mundial da UNESCO e um dos conjuntos históricos mais bem preservados de Portugal. Suas ruas revelam vestígios romanos, medievais e renascentistas que atravessam mais de dois mil anos de história.</p><p>Hoje você conhecerá dois lugares muito diferentes, unidos por uma característica em comum: ambos preservam profundamente a memória de Portugal.</p>", "route": "<h4>Santuário de Fátima</h4><p>Poucos lugares despertam emoções tão intensas quanto o Santuário de Fátima.</p><p>Foi aqui que, segundo a tradição católica, Nossa Senhora apareceu a três crianças — Lúcia, Francisco e Jacinta — entre maio e outubro de 1917. As aparições transformaram uma pequena aldeia portuguesa em um dos maiores centros de peregrinação do mundo.</p><p>Ao entrar na grande esplanada, observe suas dimensões. Ela foi projetada para receber centenas de milhares de pessoas durante as grandes celebrações religiosas e transmite uma impressionante sensação de amplitude.</p><p>Mais do que admirar a arquitetura, permita-se perceber o ambiente. O silêncio de muitos peregrinos, as velas acesas, as pessoas rezando e os grupos vindos de diferentes países revelam a dimensão espiritual deste lugar.</p><p>Independentemente de suas crenças, é difícil permanecer indiferente à atmosfera de paz que caracteriza Fátima.</p><h4>Capelinha das Aparições</h4><p>No centro do Santuário encontra-se seu local mais simbólico.</p><p>A pequena Capelinha das Aparições marca o ponto onde, segundo o relato dos três pastorinhos, ocorreram as manifestações de Nossa Senhora.</p><p>Observe como a simplicidade da construção contrasta com a grandiosidade da esplanada ao redor. É justamente essa simplicidade que concentra a atenção dos peregrinos.</p><p>Sob a cobertura está preservado o local da antiga azinheira onde as aparições teriam ocorrido. Diante dele, pessoas de diferentes nacionalidades permanecem em oração durante todo o dia.</p><p>É um espaço que convida naturalmente ao silêncio.</p><h4>Via Sacra dos Valinhos</h4><p>Poucos visitantes conhecem um dos lugares mais tranquilos de Fátima.</p><p>A Via Sacra dos Valinhos percorre um caminho arborizado que acompanha parte do trajeto realizado pelas três crianças entre suas casas e a Cova da Iria.</p><p>Ao longo do percurso encontram-se as quatorze estações da Via Sacra e, ao final, a pequena Capela de Santo Estêvão.</p><p>Mesmo para quem não percorre todo o caminho, a região transmite uma atmosfera muito diferente da área principal do Santuário.</p><p>É um momento agradável para caminhar em silêncio antes de seguir viagem.</p><h4>Almoço em Fátima</h4><p>Depois da visita ao Santuário, aproveite para almoçar com calma antes de seguir para o Alentejo.</p><p>A cidade oferece desde restaurantes tradicionais portugueses até pequenas casas familiares.</p><p>É uma boa oportunidade para descansar antes da viagem até Évora.</p><h4>Praça do Giraldo</h4><p>Ao chegar a Évora, a Praça do Giraldo funciona como uma excelente porta de entrada para a cidade.</p><p>Desde a Idade Média, este é o principal ponto de encontro dos moradores e o coração da vida urbana.</p><p>Observe os elegantes arcos que cercam a praça, a fonte de mármore ao centro e o constante movimento de cafés e esplanadas.</p><p>Seu nome homenageia Geraldo Geraldes, o Sem Pavor, cavaleiro responsável pela reconquista cristã da cidade em 1167.</p><p>É um ótimo lugar para começar a explorar Évora em um ritmo tranquilo.</p><h4>Templo Romano</h4><p>Poucos monumentos romanos permanecem tão bem preservados na Península Ibérica quanto o Templo Romano de Évora.</p><p>Construído provavelmente no século I, durante o período do Imperador Augusto, o templo sobreviveu a quase dois mil anos de transformações urbanas.</p><p>Ao observar suas colunas de granito e capitéis coríntios, imagine que elas já presenciaram o domínio romano, a ocupação muçulmana, a Reconquista e toda a formação de Portugal.</p><p>Durante muito tempo acreditou-se que o templo era dedicado à deusa Diana, mas hoje os historiadores consideram mais provável que tenha sido construído em homenagem ao culto imperial romano.</p><p>É um dos grandes símbolos históricos da cidade.</p><h4>Capela dos Ossos</h4><p>Poucos monumentos provocam uma reflexão tão profunda quanto a Capela dos Ossos.</p><p>Construída no século XVII por monges franciscanos, ela foi revestida com os ossos e crânios de milhares de pessoas provenientes de antigos cemitérios da cidade.</p><p>Logo na entrada, uma frase resume o propósito do lugar:</p><p>&quot;Nós ossos que aqui estamos, pelos vossos esperamos.&quot;</p><p>Longe de representar um ambiente macabro, a capela convida o visitante a refletir sobre a brevidade da vida e a igualdade de todos diante do tempo.</p><p>Observe atentamente a organização dos ossos nas paredes e nas colunas. Cada detalhe foi cuidadosamente planejado para transmitir essa mensagem.</p><p>É, sem dúvida, uma das visitas mais marcantes de toda a viagem.</p><h4>Catedral de Évora (Sé)</h4><p>A Catedral de Évora acompanha a história da cidade desde o século XIII.</p><p>Sua arquitetura mistura elementos românicos e góticos, refletindo os diferentes períodos de construção.</p><p>Antes de entrar, observe a imponência da fachada em granito e as duas torres que dominam o horizonte da cidade.</p><p>No interior, o ambiente sóbrio contrasta com a riqueza do coro alto e da capela-mor.</p><p>Se possível, suba ao terraço da catedral.</p><p>Dali, os telhados brancos de Évora se espalham até onde a vista alcança, revelando a paisagem característica do Alentejo.</p><p>É uma das melhores vistas de toda a cidade.</p><h4>Jantar em Évora</h4><p>Encerrar o dia com um jantar alentejano é quase uma continuação da visita.</p><p>A gastronomia da região valoriza ingredientes simples, azeite de excelente qualidade, ervas aromáticas e receitas transmitidas ao longo de gerações.</p><p>Experimente especialidades como a sopa de cação, as migas alentejanas, o ensopado de borrego ou pratos preparados com carne de porco preto.</p><p>Se apreciar vinhos, o Alentejo produz alguns dos rótulos mais prestigiados de Portugal.</p><p>É uma excelente maneira de concluir um dia dedicado à história, à espiritualidade e às tradições portuguesas.</p>", "food": "<h3>Roteiro gastronômico</h3><p class=\"food-line\"><strong>☕ Café da manhã:</strong> saída de Óbidos.</p><p class=\"food-line\"><strong>🍽️ Almoço:</strong> Fátima – Tia Alice • Manhãs • Hotel Estrela.</p><p class=\"food-line\"><strong>☕ Café da tarde:</strong> Praça do Giraldo.</p><p class=\"food-line\"><strong>🍷 Jantar:</strong> Évora – Fialho • Taberna Típica Quarta-Feira • Botequim da Mouraria.</p>", "gmaps": "https://www.google.com/maps/search/?api=1&query=Fátima+&+Évora+Portugal"}, "11": {"label": "D11", "title": "Évora", "region": "Évora", "map": "mapa_d11.png", "opening": "<p class=\"day-subtitle\">O Alentejo antes do Algarve</p><p>A primeira impressão de Évora costuma ser causada pelos seus monumentos. A segunda, muito mais duradoura, nasce do seu ritmo.</p><p>Depois de conhecer a história da cidade no dia anterior, hoje é um convite para caminhar sem pressa, observar os detalhes que muitas vezes passam despercebidos e aproveitar a atmosfera tranquila que faz de Évora uma das cidades mais agradáveis de Portugal.</p><p>As ruas estreitas, as fachadas caiadas de branco, as portas coloridas e o aroma vindo dos cafés lembram constantemente que o Alentejo possui um tempo próprio. Antes de seguir viagem rumo ao Algarve, vale a pena viver esse ritmo por algumas horas.</p>", "route": "<h4>Capela dos Ossos</h4><p>Mesmo para quem já conhece sua fama, a Capela dos Ossos dificilmente deixa de impressionar.</p><p>Construída no século XVII por monges franciscanos, ela foi revestida com milhares de ossos humanos provenientes de antigos cemitérios da cidade. A intenção nunca foi causar medo, mas recordar a brevidade da existência e convidar à reflexão.</p><p>Logo na entrada, a inscrição resume essa mensagem:</p><p>&quot;Nós ossos que aqui estamos, pelos vossos esperamos.&quot;</p><p>Observe como crânios, tíbias e fêmures foram organizados de maneira simétrica, transformando um espaço de contemplação em uma das obras mais singulares da arquitetura religiosa portuguesa.</p><p>É um lugar que costuma permanecer na memória muito depois da visita terminar.</p><h4>Igreja de São Francisco</h4><p>Ao sair da Capela dos Ossos, reserve alguns minutos para conhecer a igreja que a abriga.</p><p>Construída entre os séculos XV e XVI, a Igreja de São Francisco é considerada um dos melhores exemplos do estilo gótico-manuelino em Portugal.</p><p>Observe as altas colunas, a luminosidade do interior e a riqueza dos detalhes arquitetônicos. Diferentemente da sobriedade da Capela dos Ossos, aqui predominam a amplitude e a elegância.</p><p>A visita mostra dois lados muito diferentes da espiritualidade portuguesa reunidos no mesmo conjunto monumental.</p><h4>Praça do Giraldo</h4><p>Nenhum lugar traduz melhor o cotidiano de Évora do que a Praça do Giraldo.</p><p>Desde a Idade Média ela funciona como o principal ponto de encontro da cidade. Mercados, celebrações, anúncios públicos e acontecimentos históricos passaram por este espaço ao longo de mais de seis séculos.</p><p>Observe a elegante fonte de mármor
